<!DOCTYPE html>

<meta charset="UTF-8">

<title>kanalearn</title>
<style>
    body {
        background-color: rgba(173, 209, 186, 0.978);
        font-family: Arial, Helvetica, sans-serif;
    }
    h1 {
        color: rgba(118, 4, 4, 0.437);
    }
    h2 {
        color: rgba(4, 107, 73, 0.597);
    }
    button {
        background-color: rgb(227, 172, 89);
        color: rgb(8, 147, 73);
        font-size: larger;
        font-weight: 700;
        padding: 15px 20px;
        border: none;
        border-radius: 10px;
        margin: 4px;
        cursor: pointer;
    }
    button.scriptBtn.active {
        background-color: rgb(8, 147, 73);
        color: rgb(255, 255, 255);
    }
    li {
        color: rgb(24, 10, 214);
        font-size: 28px;
        font-weight: 500;
        background-color: rgb(213, 232, 216);
        padding: 8px;
        border-radius: 4px;
    }
    li small {
        font-size: 12px;
        word-break: break-all;
    }
    ul {
        display: grid;
        grid-template-columns: repeat(5, 70px);
        gap: 14px;
        list-style: none;
        padding: 0;
    }
    canvas {
        touch-action: none;
    }
    #drawBoardWrapper {
        position: relative;
        display: inline-block;
    }
    #bigCheck, #bigCross {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 300px;
        height: 300px;
        align-items: center;
        justify-content: center;
        pointer-events: none;
    }
    #bigCheck svg, #bigCross svg {
        width: 150px;
        height: 150px;
        animation: popIn 0.35s ease-out;
    }
    @keyframes popIn {
        0% { transform: scale(0); opacity: 0; }
        60% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
    }
    .strokeFlash {
        position: absolute;
        width: 40px;
        height: 40px;
        pointer-events: none;
        animation: flashPop 0.7s ease-out forwards;
    }
    @keyframes flashPop {
        0% { transform: scale(0); opacity: 0; }
        40% { transform: scale(1.2); opacity: 1; }
        75% { transform: scale(1); opacity: 1; }
        100% { transform: scale(1); opacity: 0; }
    }
    #practiceLayout {
        display: flex;
        gap: 40px;
        flex-wrap: wrap;
        align-items: flex-start;
    }
    #sidePanel {
        min-width: 220px;
        max-width: 280px;
        background-color: rgb(213, 232, 216);
        padding: 12px 20px 20px;
        border-radius: 10px;
    }
    #modeLabel {
        font-weight: 700;
        color: rgb(4, 107, 73);
    }
    #testPrompt {
        font-size: 24px;
        color: #BF3B30;
        font-weight: 700;
        min-height: 34px;
    }
    #testScore {
        font-size: 20px;
        font-weight: 700;
        color: rgb(24, 10, 214);
    }
</style>
</head>
<body>
<h1>kanalearn</h1>
<p>A place to practice writing Japanese Hiragana, Katakana, and Kanji.</p>

<h2>Script</h2>
<button id="btnHiragana" class="scriptBtn active" onclick="setScript('hiragana')">Hiragana</button>
<button id="btnKatakana" class="scriptBtn" onclick="setScript('katakana')">Katakana</button>
<button id="btnKanji" class="scriptBtn" onclick="setScript('kanji')">Kanji (N5)</button>

<h2>Sample Characters</h2>
<ul id="charList"></ul>

<button onclick="startPractice()">start practice</button>
<button onclick="startTest()">start test</button>

<div id="practiceBox" style="display: none;">
  <div id="practiceLayout">

    <div>
      <h2>Practice Writing</h2>
      <p id="practiceLine">Character to practice: <span id="targetChar" style="font-size: 30px; color: #BF3B30;">あ</span></p>
      <div id="drawBoardWrapper">
        <canvas id="drawBoard" width="300" height="300" style="border: 2px solid #2A4162; background: white;"></canvas>

        <div id="bigCheck">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="rgba(46,204,113,0.95)"/>
            <path d="M25 52 L42 68 L75 30" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <div id="bigCross">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="rgba(231,76,60,0.95)"/>
            <path d="M32 32 L68 68 M68 32 L32 68" stroke="white" stroke-width="10" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <br>
      <button onclick="clearBoard()">Clear</button>
      <p id="strokeStatus"></p>
    </div>

    <div id="sidePanel">
      <h2>Mode</h2>
      <p id="modeLabel">Practice mode</p>
      <button onclick="startPractice()">Practice</button>
      <button onclick="startTest()">Test</button>
      <p id="testPrompt"></p>
      <p id="testScore"></p>
    </div>

  </div>
</div>

<div>
  <p>This is a box. Div is used to group things together.</p>
</div>

// ---------- Script (hiragana / katakana / kanji) ----------
let currentScript = "hiragana";

const scriptNames = {
  hiragana: "Hiragana",
  katakana: "Katakana",
  kanji: "Kanji N5"
};

function getSet() {
  if (currentScript === "katakana") return katakana;
  if (currentScript === "kanji") return kanji;
  return hiragana;
}

function setScript(name) {
  currentScript = name;
  document.getElementById("btnHiragana").classList.toggle("active", name === "hiragana");
  document.getElementById("btnKatakana").classList.toggle("active", name === "katakana");
  document.getElementById("btnKanji").classList.toggle("active", name === "kanji");
  buildList();
  // start a fresh character from the new script if the board is open
  if (document.getElementById("practiceBox").style.display === "block") {
    if (testMode) {
      startTest();
    } else {
      startPractice();
    }
  }
}

// ---------- Test mode state ----------
const PASS_PERCENT = 80;
let testMode = false;
let testCorrect = 0;
let testDone = false;
let inkSnapshot = null;

const list = document.getElementById("charList");

function buildList() {
  list.innerHTML = "";
  const set = getSet();
  for (let i = 0; i < set.length; i++) {
    const li = document.createElement("li");
    li.innerHTML = set[i].char + "<br><small>" + set[i].romaji + "</small>";
    li.style.cursor = "pointer";
    li.onclick = function() {
      exitTestMode();
      document.getElementById("targetChar").textContent = set[i].char;
      document.getElementById("practiceBox").style.display = "block";
      startStrokeChecking();
    };
    list.appendChild(li);
  }
}

buildList();

function startPractice() {
  exitTestMode();
  const set = getSet();
  const randomChar = set[Math.floor(Math.random() * set.length)];
  document.getElementById("targetChar").textContent = randomChar.char;
  document.getElementById("practiceBox").style.display = "block";
  startStrokeChecking();
  document.getElementById("practiceBox").scrollIntoView({ behavior: "smooth" });
}

// ---------- Test mode ----------
function startTest() {
  const set = getSet();
  const c = set[Math.floor(Math.random() * set.length)];
  testMode = true;
  testCorrect = 0;
  testDone = false;
  document.getElementById("targetChar").textContent = c.char;
  document.getElementById("practiceLine").style.display = "none";
  document.getElementById("modeLabel").textContent = "Test mode (" + scriptNames[currentScript] + ")";
  if (currentScript === "kanji") {
    document.getElementById("testPrompt").textContent = 'Write the kanji for: "' + c.romaji + '"';
  } else {
    document.getElementById("testPrompt").textContent = 'Write: "' + c.romaji + '"';
  }
  document.getElementById("testScore").textContent = "";
  document.getElementById("practiceBox").style.display = "block";
  startStrokeChecking();
  document.getElementById("practiceBox").scrollIntoView({ behavior: "smooth" });
}

function exitTestMode() {
  testMode = false;
  testDone = false;
  document.getElementById("practiceLine").style.display = "block";
  document.getElementById("modeLabel").textContent = "Practice mode";
  document.getElementById("testPrompt").textContent = "";
  document.getElementById("testScore").textContent = "";
}

function checkTestStroke(strokes, sx, sy, ex, ey) {
  if (testDone) return;

  // compare with the expected stroke, but never stop: just count it
  if (strokeMatches(strokes[currentStrokeIndex], sx, sy, ex, ey)) {
    testCorrect++;
  }
  currentStrokeIndex++;

  if (currentStrokeIndex < strokes.length) {
    document.getElementById("strokeStatus").textContent =
      "Stroke " + (currentStrokeIndex + 1) + " of " + strokes.length + " - keep writing";
  } else {
    finishTest(strokes.length);
  }
}

function finishTest(totalStrokes) {
  testDone = true;
  const score = Math.round(testCorrect / totalStrokes * 100);
  const passed = score >= PASS_PERCENT;
  const c = document.getElementById("targetChar").textContent;

  document.getElementById("testScore").textContent =
    "Score: " + score + "% (" + testCorrect + " of " + totalStrokes + " strokes right). Answer: " + c;

  if (passed) {
    document.getElementById("strokeStatus").textContent = "Right! You got " + score + "%.";
    showBigCheck();
  } else {
    document.getElementById("strokeStatus").textContent =
      "Wrong. You got " + score + "%, need " + PASS_PERCENT + "%. Press Clear to retry or Test for a new one.";
    showBigCross();
  }
}

// ---------- Canvas drawing ----------
const canvas = document.getElementById("drawBoard");
const ctx = canvas.getContext("2d");
let isDrawing = false;
let completedStrokes = [];
let strokeStartX = 0, strokeStartY = 0;
let lastX = 0, lastY = 0;

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  if (e.touches && e.touches.length > 0) {
    return {
      x: e.touches[0].clientX - rect.left,
      y: e.touches[0].clientY - rect.top
    };
  }
  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

function startDraw(e) {
  e.preventDefault();
  if (testMode && testDone) return;   // test finished, no more drawing
  isDrawing = true;
  if (testMode) {
    inkSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  }
  const pos = getPos(e);
  strokeStartX = pos.x;
  strokeStartY = pos.y;
  lastX = pos.x;
  lastY = pos.y;
  ctx.strokeStyle = "#333333";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(pos.x, pos.y);
}

function moveDraw(e) {
  e.preventDefault();
  if (isDrawing) {
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    lastX = pos.x;
    lastY = pos.y;
  }
}

function endDraw(e) {
  if (!isDrawing) return;
  e.preventDefault();
  isDrawing = false;
  // ignore taps / tiny strokes
  if (Math.hypot(lastX - strokeStartX, lastY - strokeStartY) < 15) {
    if (testMode && inkSnapshot) {
      ctx.putImageData(inkSnapshot, 0, 0);   // remove the tiny dot, keep earlier ink
    } else {
      redrawCanvas();
    }
    return;
  }
  checkUserStroke(strokeStartX, strokeStartY, lastX, lastY);
}

canvas.addEventListener("mousedown", startDraw);
canvas.addEventListener("mousemove", moveDraw);
window.addEventListener("mouseup", endDraw);   // works even if mouse is released outside the canvas

canvas.addEventListener("touchstart", startDraw, { passive: false });
canvas.addEventListener("touchmove", moveDraw, { passive: false });
canvas.addEventListener("touchend", endDraw, { passive: false });

function clearBoard() {
  completedStrokes = [];
  currentStrokeIndex = 0;
  hideBigCheck();
  hideBigCross();
  redrawCanvas();
  const targetChar = document.getElementById("targetChar").textContent;
  const strokes = strokeData[targetChar];
  if (testMode) {
    testCorrect = 0;
    testDone = false;
    document.getElementById("testScore").textContent = "";
    if (strokes) {
      document.getElementById("strokeStatus").textContent =
        "Test mode: stroke 1 of " + strokes.length + " - write the whole character";
    }
  } else if (strokes) {
    document.getElementById("strokeStatus").textContent =
      "Stroke 1 of " + strokes.length + " - draw the first line";
  }
}

function drawGuide() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (testMode) return;   // no guide character in test mode
  ctx.font = "200px sans-serif";
  ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const targetChar = document.getElementById("targetChar").textContent;
  ctx.fillText(targetChar, canvas.width / 2, canvas.height / 2);
}

function showBigCheck() {
  hideBigCross();
  const el = document.getElementById("bigCheck");
  el.style.display = "none";
  void el.offsetWidth;
  el.style.display = "flex";
}

function hideBigCheck() {
  document.getElementById("bigCheck").style.display = "none";
}

function showBigCross() {
  hideBigCheck();
  const el = document.getElementById("bigCross");
  el.style.display = "none";

function flashStrokeCheck(x, y) {
  const wrapper = document.getElementById("drawBoardWrapper");
  const flash = document.createElement("div");
  flash.className = "strokeFlash";
  flash.style.left = (x - 20) + "px";
  flash.style.top = (y - 20) + "px";
  flash.innerHTML =
    '<svg viewBox="0 0 100 100" width="40" height="40">' +
    '<circle cx="50" cy="50" r="45" fill="rgba(46,204,113,0.95)"/>' +
    '<path d="M25 52 L42 68 L75 30" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>';
  wrapper.appendChild(flash);
  setTimeout(function() {
    flash.remove();
  }, 700);
}

// merge kanji into strokeData
for (const k in kanjiStrokes) {
  strokeData[k] = kanjiStrokes[k].map(function(a) {
    return { x1: a[0], y1: a[1], x2: a[2], y2: a[3] };
  });
}

let currentStrokeIndex = 0;

function startStrokeChecking() {
  completedStrokes = [];
  currentStrokeIndex = 0;
  hideBigCheck();
  hideBigCross();
  redrawCanvas();

  const targetChar = document.getElementById("targetChar").textContent;
  const strokes = strokeData[targetChar];

  if (!strokes) {
    document.getElementById("strokeStatus").textContent = "No stroke data for this character yet.";
    return;
  }
  if (testMode) {
    document.getElementById("strokeStatus").textContent =
      "Test mode: stroke 1 of " + strokes.length + " - write the whole character (no hints!)";
  } else {
    document.getElementById("strokeStatus").textContent =
      "Stroke 1 of " + strokes.length + " - draw the first line";
  }
}

function redrawCanvas() {
  drawGuide();
  for (let i = 0; i < completedStrokes.length; i++) {
    drawStroke(completedStrokes[i], i + 1);
  }
  const targetChar = document.getElementById("targetChar").textContent;
  const strokes = strokeData[targetChar];
  if (strokes && currentStrokeIndex < strokes.length) {
    showStrokeHint();
  }
}

function showStrokeHint() {
  if (testMode) return;   // no hints in test mode
  const targetChar = document.getElementById("targetChar").textContent;
  const strokes = strokeData[targetChar];
  if (!strokes || currentStrokeIndex >= strokes.length) return;

  const s = strokes[currentStrokeIndex];
  ctx.strokeStyle = "rgba(42, 109, 244, 0.4)";
  ctx.lineWidth = 3;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(s.x1, s.y1);
  ctx.lineTo(s.x2, s.y2);
  ctx.stroke();
  ctx.setLineDash([]);

  drawArrowhead(s.x1, s.y1, s.x2, s.y2, "rgba(42, 109, 244, 0.6)");
}

// true if the user's stroke matches the expected stroke
function strokeMatches(expected, userStartX, userStartY, userEndX, userEndY) {
  const userAngle = Math.atan2(userEndY - userStartY, userEndX - userStartX);
  const expectedAngle = Math.atan2(expected.y2 - expected.y1, expected.x2 - expected.x1);
  let angleDiff = Math.abs(userAngle - expectedAngle);
  if (angleDiff > Math.PI) angleDiff = 2 * Math.PI - angleDiff;

  const startDist = Math.hypot(userStartX - expected.x1, userStartY - expected.y1);

  const angleTolerance = Math.PI / 4;
  const startTolerance = 50;

  return angleDiff <= angleTolerance && startDist <= startTolerance;
}

function checkUserStroke(userStartX, userStartY, userEndX, userEndY) {
  const targetChar = document.getElementById("targetChar").textContent;
  const strokes = strokeData[targetChar];
  if (!strokes) return;

  // Test mode: count strokes, judge only at the end
  if (testMode) {
    checkTestStroke(strokes, userStartX, userStartY, userEndX, userEndY);
    return;
  }

  // ---------- Practice mode ----------
  if (currentStrokeIndex >= strokes.length) {
    document.getElementById("strokeStatus").textContent = "All strokes complete!";
    return;
  }

  const expected = strokes[currentStrokeIndex];

  if (strokeMatches(expected, userStartX, userStartY, userEndX, userEndY)) {
    completedStrokes.push(expected);
    currentStrokeIndex++;
    redrawCanvas();
    flashStrokeCheck(expected.x2, expected.y2);
    if (currentStrokeIndex < strokes.length) {
      document.getElementById("strokeStatus").textContent =
        "Correct! Now draw stroke " + (currentStrokeIndex + 1) + ".";
    } else {
      document.getElementById("strokeStatus").textContent = "All strokes correct!";
      showBigCheck();
    }
  } else {
    redrawCanvas();
    drawWrongStroke(expected);
    document.getElementById("strokeStatus").textContent =
      "Wrong direction. Follow the red line, then try again.";
  }
}

function drawStroke(stroke, number) {
  const { x1, y1, x2, y2 } = stroke;

  ctx.strokeStyle = "green";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  drawArrowhead(x1, y1, x2, y2, "green");
  drawStrokeNumber(x1, y1, number, "green");
  drawCheckmark(x2, y2);
}

function drawWrongStroke(stroke) {
  const { x1, y1, x2, y2 } = stroke;

  ctx.strokeStyle = "red";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();

  drawArrowhead(x1, y1, x2, y2, "red");
  drawStrokeNumber(x1, y1, currentStrokeIndex + 1, "red");
}

function drawArrowhead(x1, y1, x2, y2, color) {
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const headLength = 12;

  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(
    x2 - headLength * Math.cos(angle - Math.PI / 6),
    y2 - headLength * Math.sin(angle - Math.PI / 6)
  );
  ctx.moveTo(x2, y2);
  ctx.lineTo(
    x2 - headLength * Math.cos(angle + Math.PI / 6),
    y2 - headLength * Math.sin(angle + Math.PI / 6)
  );
  ctx.stroke();
}

function drawStrokeNumber(x, y, number, color) {
  ctx.beginPath();
  ctx.arc(x, y, 12, 0, Math.PI * 2);
  ctx.fillStyle = "white";
  ctx.fill();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = color;
  ctx.font = "bold 16px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(number, x, y);
}

function drawCheckmark(x, y) {
  ctx.beginPath();
  ctx.arc(x + 15, y - 15, 12, 0, Math.PI * 2);
  ctx.fillStyle = "green";
  ctx.fill();

  ctx.strokeStyle = "white";
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x + 10, y - 15);
  ctx.lineTo(x + 14, y - 11);
  ctx.lineTo(x + 21, y - 20);
  ctx.stroke();
}
