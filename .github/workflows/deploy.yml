# Deploys on every push to the publish/main branch:
#   1. audio  → GitHub Pages (free; both voices are too big for the Vercel Hobby upload limit)
#   2. site   → Vercel production, built to play audio from the GitHub Pages URL
#
# One-time setup:
#   - Repository secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
#   - Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   - Settings → Environments → github-pages → Deployment branches: allow "publish/main".
name: Deploy

on:
  push:
    branches: ["publish/main"]
  workflow_dispatch: # allows a manual run from the Actions tab

# Only one production deploy at a time; a newer push replaces a queued one.
concurrency:
  group: production
  cancel-in-progress: true

jobs:
  audio:
    name: Audio → GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Collect audio
        run: |
          mkdir -p _site
          cp -r public/audio _site/audio
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

  site:
    name: Site → Vercel
    needs: audio
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # e.g. https://<user>.github.io/<repo>/audio — read by src/lib/audio.ts at build time.
      NEXT_PUBLIC_AUDIO_BASE: ${{ needs.audio.outputs.url }}audio
    steps:
      - name: Check Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Audio is served from GitHub Pages; leaving it out keeps the Vercel upload small.
      - name: Drop audio from the Vercel build
        run: |
          echo "Audio base: $NEXT_PUBLIC_AUDIO_BASE"
          rm -rf public/audio

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # The Vercel CLI attaches the commit author to the deployment. On the Hobby plan that
      # author must be the Vercel account owner, which isn't true for commits made by other
      # GitHub users (e.g. the repo owner). Deploying without git metadata avoids the block.
      - name: Strip git metadata
        run: rm -rf .git

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
