<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="refrigerator, fridge">
  <!-- 冷蔵庫 (refrigerator): a white fridge with its door open, showing milk, an apple and food on cold shelves -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="76" cy="80" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="84" cy="144" rx="58" ry="5" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- body and freezer -->
    <rect x="30" y="10" width="82" height="132" rx="9" fill="#fff"/>
    <path d="M30 50 H112" fill="none"/>
    <rect x="98" y="22" width="6" height="18" rx="3" fill="#9aa3b0"/>
    <!-- open fridge compartment -->
    <rect x="37" y="56" width="68" height="80" rx="3" fill="#e3eaf6"/>
    <path d="M37 82 H105 M37 108 H105" fill="none" stroke-width="3"/>
    <!-- top shelf: cheese and a jar -->
    <path d="M44 81 V70 L64 64 V81 Z" fill="#f2c14e"/>
    <circle cx="52" cy="74" r="2" fill="#2b2622" stroke="none" opacity=".4"/>
    <rect x="76" y="66" width="16" height="15" rx="3" fill="#d9534a"/>
    <rect x="74" y="62" width="20" height="6" rx="2" fill="#efe6dc"/>
    <!-- middle shelf: a bowl of salad -->
    <path d="M44 98 H78 Q76 107 61 107 Q46 107 44 98 Z" fill="#fff"/>
    <path d="M47 98 Q49 90 55 93 Q59 87 64 92 Q70 88 74 94 Q76 95 76 98 Z" fill="#4f8a5b"/>
    <path d="M84 107 V95 Q84 92 87 92 H96 Q99 92 99 95 V107 Z" fill="#efe6dc"/>
    <!-- bottom shelf: milk and an apple -->
    <path d="M46 134 V116 L50 110 H62 L66 116 V134 Z" fill="#fff"/>
    <path d="M46 122 H66" fill="none" stroke="#3b5ba5" stroke-width="5"/>
    <path d="M50 110 L56 116 L62 110" fill="none" stroke-width="2"/>
    <path d="M56 116 V134" fill="none" stroke-width="1.5" opacity=".4"/>
    <circle cx="86" cy="127" r="7.5" fill="#d9534a"/>
    <path d="M86 120 Q87 116 90 115" fill="none" stroke-width="2"/>
    <!-- open door with bottle racks -->
    <path d="M112 54 L140 46 V150 L112 140 Z" fill="#fff"/>
    <rect x="121" y="62" width="7" height="22" rx="3" fill="#4f8a5b"/>
    <rect x="130" y="96" width="6" height="18" rx="3" fill="#f2c14e"/>
    <path d="M116 82 L136 78 V86 L116 90 Z" fill="#efe6dc"/>
    <path d="M116 112 L136 110 V118 L116 120 Z" fill="#efe6dc"/>
    <!-- cold sparkles -->
    <path d="M18 66 V76 M13 71 H23 M22 104 V110 M19 107 H25" fill="none" stroke="#3b5ba5" stroke-width="2.5"/>
  </g>
</svg>
