<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="mailbox, postbox">
  <!-- ポスト (mailbox): a red Japanese postbox with two slots and the white post mark -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="80" r="52" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="140" rx="36" ry="5" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- foot -->
    <rect x="64" y="122" width="32" height="18" rx="2" fill="#3d3a4a"/>
    <!-- body -->
    <rect x="50" y="34" width="60" height="92" rx="8" fill="#d9534a"/>
    <!-- lid -->
    <rect x="45" y="26" width="70" height="14" rx="6" fill="#d9534a"/>
    <!-- two slots -->
    <rect x="57" y="50" width="20" height="6" rx="2" fill="#2b2622"/>
    <rect x="83" y="50" width="20" height="6" rx="2" fill="#2b2622"/>
    <!-- post mark -->
    <path d="M68 70 H92 M68 79 H92 M80 79 V96" fill="none" stroke="#fff" stroke-width="4.5"/>
    <!-- collection door -->
    <rect x="60" y="102" width="40" height="16" rx="2" fill="none" stroke-width="2"/>
    <circle cx="94" cy="110" r="2" fill="#f2c14e" stroke-width="1.5"/>
  </g>
</svg>
