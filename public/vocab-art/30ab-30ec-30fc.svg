<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="curry (and rice)">
  <!-- カレー (curry and rice): a plate with white rice on one side and golden curry with carrot, potato and meat, a spoon resting in it -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <ellipse cx="80" cy="132" rx="62" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- steam -->
    <g fill="none" stroke="#9a958b" stroke-width="3">
      <path d="M70 52 Q66 46 70 40 Q74 34 70 28"/>
      <path d="M90 50 Q86 44 90 38 Q94 32 90 26"/>
    </g>
    <!-- plate -->
    <ellipse cx="80" cy="96" rx="68" ry="34" fill="#fff"/>
    <ellipse cx="80" cy="96" rx="54" ry="25" fill="none" opacity=".25"/>
    <!-- rice -->
    <path d="M28 96 Q26 72 56 66 Q82 64 88 82 Q86 108 60 114 Q30 114 28 96 Z" fill="#fff"/>
    <path d="M42 80 h1 M56 74 h1 M48 96 h1 M38 102 h1 M66 86 h1" fill="none" stroke-width="2.4" opacity=".5"/>
    <!-- curry -->
    <path d="M70 80 Q96 64 122 76 Q138 90 128 106 Q110 122 82 116 Q66 108 72 96 Q64 88 70 80 Z" fill="#c98a2e"/>
    <rect x="84" y="80" width="12" height="9" rx="2" fill="#e8893a" transform="rotate(-15 90 84)"/>
    <rect x="108" y="98" width="12" height="9" rx="2" fill="#e8893a" transform="rotate(20 114 102)"/>
    <rect x="102" y="76" width="13" height="12" rx="4" fill="#f6dc8a"/>
    <rect x="82" y="100" width="13" height="12" rx="4" fill="#f6dc8a" transform="rotate(10 88 106)"/>
    <rect x="116" y="84" width="11" height="10" rx="3" fill="#8a5a3b"/>
    <rect x="96" y="104" width="10" height="9" rx="3" fill="#8a5a3b"/>
    <!-- spoon -->
    <path d="M118 96 L148 120" fill="none" stroke-width="9"/>
    <path d="M118 96 L148 120" fill="none" stroke="#9aa3b0" stroke-width="4"/>
    <ellipse cx="108" cy="88" rx="12" ry="7" fill="#9aa3b0" transform="rotate(38 108 88)"/>
  </g>
</svg>
