<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="illness, sickness; sick">
  <!-- 病気 (illness; sick): a sick person lying in bed with an ice pack on the forehead and a thermometer in the mouth -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="80" cy="86" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="82" cy="141" rx="62" ry="6" fill="#f1cfc7"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- bed -->
    <rect x="16" y="66" width="13" height="74" rx="4" fill="#c9a26b"/>
    <rect x="134" y="92" width="11" height="48" rx="4" fill="#c9a26b"/>
    <rect x="24" y="104" width="114" height="16" rx="3" fill="#fff"/>
    <rect x="24" y="118" width="114" height="10" fill="#c9a26b"/>
    <!-- pillow -->
    <path d="M30 96 Q28 86 38 86 H66 Q74 86 72 96 Q72 104 64 104 H36 Q30 104 30 96 Z" fill="#fff"/>
    <!-- head on the pillow -->
    <g transform="translate(52 82)">
      <circle cx="0" cy="0" r="18" fill="#f6d3b3"/>
      <path d="M-18 -1 Q-19 -22 0 -22 Q20 -22 18 0 Q14 -9 4 -10 Q-2 -6 -8 -9 Q-14 -7 -18 -1 Z" fill="#2b2622"/>
      <!-- ice pack -->
      <rect x="-13" y="-16" width="26" height="10" rx="5" fill="#c7d3ea"/>
      <path d="M-7 -11 H7" fill="none" stroke="#fff" stroke-width="2"/>
      <path d="M-9 1 Q-6 3 -3 1 M3 1 Q6 3 9 1" fill="none"/>
      <circle cx="-11" cy="6" r="3.5" fill="#d9534a" stroke="none" opacity=".45"/>
      <circle cx="11" cy="6" r="3.5" fill="#d9534a" stroke="none" opacity=".45"/>
      <path d="M-4 11 Q0 9 4 11" fill="none"/>
      <!-- thermometer -->
      <path d="M2 10 L20 2" fill="none" stroke-width="6"/>
      <path d="M2 10 L20 2" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="2.5" cy="9.8" r="2.2" fill="#d9534a" stroke-width="1.5"/>
      <!-- sweat drop -->
      <path d="M22 -14 Q26 -8 24 -5 Q22 -2 20 -5 Q18 -8 22 -14 Z" fill="#c7d3ea" stroke-width="2"/>
    </g>
    <!-- blanket over the body -->
    <path d="M62 102 Q66 88 82 88 H118 Q132 86 134 100 L136 112 Q100 116 60 112 Z" fill="#3b5ba5"/>
    <path d="M80 92 L76 112 M100 88 L98 114 M120 88 L120 114" fill="none" stroke="#fff" stroke-width="2.5" opacity=".6"/>
    <path d="M62 100 Q66 92 76 92" fill="none" stroke="#fff" stroke-width="2.5" opacity=".6"/>
  </g>
</svg>
