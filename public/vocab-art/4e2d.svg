  <circle cx="80" cy="84" r="52" fill="#fff" opacity=".55"/>
  <ellipse cx="82" cy="132" rx="54" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
