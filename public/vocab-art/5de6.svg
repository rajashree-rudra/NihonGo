<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="left">
  <!-- 左 (left): a blue road sign on a pole with a white "turn left" arrow -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="64" r="50" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="140" rx="26" ry="5" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- pole -->
    <rect x="75" y="96" width="10" height="44" rx="2" fill="#9aa3b0"/>
    <!-- sign -->
    <circle cx="80" cy="62" r="40" fill="#3b5ba5"/>
    <circle cx="80" cy="62" r="34" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- arrow: up, then turning left -->
    <path d="M98 84 V62 Q98 50 86 50 H72" fill="none" stroke-width="15"/>
    <path d="M76 34 L54 50 L76 66 Z" fill="#fff"/>
    <path d="M98 84 V62 Q98 50 86 50 H72" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="butt"/>
  </g>
</svg>
