<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="yes (softer than はい)">
  <!-- ええ (yes, softer): a person gently nodding with happy closed eyes, and a small bubble with a tick -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="70" cy="88" r="52" fill="#fff" opacity=".55"/>
  <ellipse cx="70" cy="145" rx="38" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- small speech bubble with a tick -->
    <path d="M110 22 H140 Q148 22 148 30 V46 Q148 54 140 54 H122 L112 62 L114 54 H110 Q102 54 102 46 V30 Q102 22 110 22 Z" fill="#fff"/>
    <path d="M117 38 L123 44 L133 32" fill="none" stroke="#4f8a5b" stroke-width="4"/>
    <g transform="translate(70 144)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-12" y="-40" width="9" height="37" rx="4" fill="#f6d3b3"/>
      <rect x="3" y="-40" width="9" height="37" rx="4" fill="#f6d3b3"/>
      <rect x="-27" y="-78" width="9" height="34" rx="4.5" fill="#f2c14e"/>
      <circle cx="-22.5" cy="-42" r="5.5" fill="#f6d3b3"/>
      <rect x="18" y="-78" width="9" height="34" rx="4.5" fill="#f2c14e"/>
      <circle cx="22.5" cy="-42" r="5.5" fill="#f6d3b3"/>
      <path d="M-15 -81 H15 L24 -36 H-24 Z" fill="#f2c14e"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <!-- head tipped down in a nod -->
      <g transform="rotate(8 0 -90)">
        <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
        <path d="M-19 -100 Q-21 -125 0 -125 Q21 -125 19 -100 Q15 -112 6 -113 Q0 -108 -6 -113 Q-15 -112 -19 -100 Z" fill="#5a4636"/>
        <path d="M-9 -99 Q-6 -96 -3 -99 M3 -99 Q6 -96 9 -99" fill="none"/>
        <circle cx="-11" cy="-94" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
        <circle cx="11" cy="-94" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
        <path d="M-5 -92 Q0 -88 5 -92" fill="none"/>
      </g>
      <!-- nod motion -->
      <path d="M-27 -126 Q-37 -114 -33 -100" fill="none"/>
      <path d="M-37 -105 L-33 -99 L-28 -104" fill="none"/>
    </g>
  </g>
</svg>
