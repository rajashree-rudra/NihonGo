<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="ashtray">
  <!-- 灰皿 (ashtray): a round ashtray with ash inside and a lit cigarette resting in a notch, smoke curling up -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="90" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="126" rx="56" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- smoke -->
    <path d="M94 92 Q86 80 94 70 Q102 60 94 48 Q88 40 94 30" fill="none" stroke="#9a958b" stroke-width="3.5"/>
    <!-- dish -->
    <path d="M28 96 Q30 124 80 124 Q130 124 132 96 Z" fill="#9aa3b0"/>
    <ellipse cx="80" cy="96" rx="52" ry="16" fill="#d8d3ca"/>
    <ellipse cx="80" cy="98" rx="38" ry="10" fill="#6f6a60"/>
    <circle cx="68" cy="99" r="2.5" fill="#9a958b" stroke="none"/>
    <circle cx="76" cy="102" r="2" fill="#9a958b" stroke="none"/>
    <circle cx="62" cy="96" r="1.8" fill="#9a958b" stroke="none"/>
    <!-- notches in the rim -->
    <path d="M30 92 Q34 95 30 98 M80 109 Q83 113 86 109" fill="none" stroke-width="2"/>
    <!-- cigarette -->
    <path d="M96 96 L140 84" fill="none" stroke="#2b2622" stroke-width="10"/>
    <path d="M96 96 L140 84" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M126 88 L140 84" fill="none" stroke="#f2c14e" stroke-width="5"/>
    <path d="M96 96 L100 95" fill="none" stroke="#d9534a" stroke-width="5"/>
  </g>
</svg>
