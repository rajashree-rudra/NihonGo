<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="box">
  <!-- 箱 (box): a closed cardboard box with a strip of tape -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="84" cy="134" rx="58" ry="7" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- side -->
    <path d="M104 66 L132 42 V108 L104 132 Z" fill="#c9a26b"/>
    <path d="M104 66 L132 42 V108 L104 132 Z" fill="#2b2622" opacity=".18" stroke="none"/>
    <!-- top -->
    <path d="M28 66 L56 42 H132 L104 66 Z" fill="#c9a26b"/>
    <path d="M28 66 L56 42 H132 L104 66 Z" fill="#fff" opacity=".3" stroke="none"/>
    <path d="M42 54 H118" fill="none" opacity=".45"/>
    <!-- front -->
    <rect x="28" y="66" width="76" height="66" fill="#c9a26b"/>
    <!-- tape -->
    <path d="M60 66 L88 42 H98 L70 66 Z" fill="#efe6dc"/>
    <rect x="60" y="66" width="10" height="20" fill="#efe6dc"/>
    <!-- carry handle hole -->
    <rect x="43" y="98" width="20" height="8" rx="4" fill="#6f6a60"/>
  </g>
</svg>
