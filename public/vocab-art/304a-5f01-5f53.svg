<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="boxed lunch, bento">
  <!-- お弁当 (bento): an open lunch box, rice with a pickled plum on one side, rolled egg, sausages and broccoli on the other, chopsticks in front -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <ellipse cx="80" cy="128" rx="64" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- box: side and top -->
    <path d="M18 102 V114 Q18 124 30 124 H130 Q142 124 142 114 V102 Z" fill="#3d3a4a"/>
    <rect x="18" y="28" width="124" height="86" rx="12" fill="#3d3a4a"/>
    <rect x="25" y="35" width="110" height="72" rx="7" fill="#d9534a"/>
    <!-- rice -->
    <rect x="29" y="39" width="46" height="64" rx="4" fill="#fff"/>
    <circle cx="52" cy="71" r="8" fill="#d9534a"/>
    <path d="M49 67 Q51 65 53 66" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M38 50 h1 M64 52 h1 M40 90 h1 M62 92 h1 M36 76 h1 M68 74 h1" fill="none" stroke-width="2.6"/>
    <!-- rolled egg -->
    <rect x="80" y="40" width="22" height="22" rx="4" fill="#f2c14e"/>
    <path d="M86 51 Q86 46 91 46 Q96 46 96 51 Q96 56 91 56 Q88 56 88 52" fill="none" stroke-width="1.8"/>
    <rect x="80" y="62" width="22" height="20" rx="4" fill="#f2c14e"/>
    <path d="M86 72 Q86 67 91 67 Q96 67 96 72 Q96 76 91 76" fill="none" stroke-width="1.8"/>
    <!-- broccoli -->
    <path d="M114 62 L116 76 H124 L126 62" fill="#9cc27a"/>
    <path d="M110 56 Q106 46 114 44 Q116 38 122 40 Q130 38 131 46 Q136 52 130 58 Q126 64 120 61 Q114 64 110 56 Z" fill="#4f8a5b"/>
    <!-- sausages -->
    <rect x="80" y="86" width="26" height="13" rx="6.5" fill="#d9534a" transform="rotate(-8 93 92)"/>
    <rect x="104" y="84" width="26" height="13" rx="6.5" fill="#d9534a" transform="rotate(10 117 90)"/>
    <path d="M86 90 l3 4 M92 89 l3 4 M110 87 l3 4 M116 88 l3 4" fill="none" stroke-width="1.8"/>
    <!-- chopsticks -->
    <path d="M24 134 L136 131 L136 136 L24 136 Z" fill="#c9a26b" stroke-width="2"/>
    <path d="M24 139 L136 137 L136 142 L24 141 Z" fill="#c9a26b" stroke-width="2"/>
  </g>
</svg>
