<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="salt">
  <!-- 塩 (salt): a salt shaker tipped over, shaking white grains onto a little pile -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="84" cy="80" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="62" cy="134" rx="46" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- shaker, tilted so the cap points down to the left -->
    <g transform="translate(104 58) rotate(-135)">
      <rect x="-22" y="-28" width="44" height="62" rx="9" fill="#eef3f9"/>
      <rect x="-19" y="-24" width="38" height="54" rx="7" fill="#fff" stroke="none"/>
      <path d="M-14 -16 h1 M6 -10 h1 M-6 4 h1 M10 12 h1 M-12 20 h1" fill="none" stroke="#9a958b" stroke-width="2.4"/>
      <path d="M-14 -18 V22" fill="none" stroke="#c3dcf5" stroke-width="4"/>
      <path d="M-22 -26 V-36 Q-22 -50 0 -50 Q22 -50 22 -36 V-26 Z" fill="#9aa3b0"/>
      <path d="M-22 -30 H22" fill="none"/>
      <circle cx="-8" cy="-42" r="1.8" fill="#2b2622" stroke="none"/>
      <circle cx="0" cy="-45" r="1.8" fill="#2b2622" stroke="none"/>
      <circle cx="8" cy="-42" r="1.8" fill="#2b2622" stroke="none"/>
      <circle cx="0" cy="-38" r="1.8" fill="#2b2622" stroke="none"/>
    </g>
    <!-- falling grains -->
    <g fill="#fff" stroke-width="1.6">
      <rect x="54" y="98" width="4.5" height="4.5" rx="1"/>
      <rect x="62" y="104" width="4.5" height="4.5" rx="1"/>
      <rect x="48" y="108" width="4.5" height="4.5" rx="1"/>
      <rect x="58" y="114" width="4.5" height="4.5" rx="1"/>
      <rect x="68" y="94" width="4.5" height="4.5" rx="1"/>
    </g>
    <!-- little pile of salt -->
    <path d="M30 134 Q46 116 62 120 Q78 116 94 134 Z" fill="#fff"/>
  </g>
</svg>
