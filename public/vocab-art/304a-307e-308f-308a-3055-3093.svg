<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="police officer (friendly term)">
  <!-- おまわりさん (friendly police officer): the same officer as 警官, smiling and pointing the way for a grey person holding a map -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="94" cy="86" r="50" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="141" rx="66" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- person asking the way (grey), holding a map -->
    <g transform="translate(36 140) scale(.82)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#6f6a60"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#6f6a60"/>
      <rect x="-13" y="-40" width="10" height="37" rx="4" fill="#9a958b"/>
      <rect x="3" y="-40" width="10" height="37" rx="4" fill="#9a958b"/>
      <rect x="-28" y="-78" width="10" height="30" rx="5" fill="#d8d3ca"/>
      <rect x="18" y="-78" width="10" height="30" rx="5" fill="#d8d3ca"/>
      <path d="M-20 -38 V-70 Q-20 -81 -9 -81 H9 Q20 -81 20 -70 V-38 Z" fill="#d8d3ca"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#efe6dc" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#efe6dc"/>
      <path d="M-19 -100 Q-21 -125 0 -125 Q21 -125 19 -100 Q15 -112 6 -113 Q0 -108 -6 -113 Q-15 -112 -19 -100 Z" fill="#6f6a60"/>
      <circle cx="-6" cy="-100" r="2.4" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-100" r="2.4" fill="#2b2622" stroke="none"/>
      <path d="M-4 -91 Q0 -89 4 -91" fill="none"/>
      <!-- map -->
      <path d="M-24 -70 L-8 -74 L8 -70 L24 -74 V-48 L8 -44 L-8 -48 L-24 -44 Z" fill="#efe6dc"/>
      <path d="M-8 -74 V-48 M8 -70 V-44" fill="none" stroke-width="2"/>
      <path d="M-18 -52 Q-10 -66 2 -58 Q12 -52 18 -64" fill="none" stroke="#9a958b" stroke-width="2.5" stroke-dasharray="3 4"/>
      <circle cx="-25" cy="-50" r="5.5" fill="#efe6dc"/>
      <circle cx="25" cy="-50" r="5.5" fill="#efe6dc"/>
    </g>
    <!-- officer -->
    <g transform="translate(94 140)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-13" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="3" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="-28" y="-78" width="10" height="36" rx="5" fill="#3b5ba5"/>
      <circle cx="-23" cy="-40" r="5.5" fill="#f6d3b3"/>
      <path d="M-20 -38 V-70 Q-20 -81 -9 -81 H9 Q20 -81 20 -70 V-38 Z" fill="#3b5ba5"/>
      <path d="M-8 -81 L0 -68 L8 -81 Z" fill="#fff"/>
      <path d="M0 -78 L-2.5 -72 L0 -65 L2.5 -72 Z" fill="#3d3a4a" stroke-width="1.6"/>
      <circle cx="-11" cy="-65" r="3.5" fill="#f2c14e" stroke-width="2"/>
      <rect x="-20" y="-47" width="40" height="7" fill="#3d3a4a"/>
      <rect x="-3.5" y="-48" width="7" height="9" rx="1.5" fill="#f2c14e" stroke-width="2"/>
      <!-- pointing arm -->
      <path d="M16 -76 L42 -84" stroke-width="12"/>
      <path d="M16 -76 L42 -84" stroke="#3b5ba5" stroke-width="7"/>
      <path d="M46 -87 L55 -90" stroke-width="6"/>
      <path d="M46 -87 L55 -90" stroke="#f6d3b3" stroke-width="2"/>
      <circle cx="45" cy="-85" r="5.5" fill="#f6d3b3"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <circle cx="-6" cy="-100" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-100" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10" cy="-94" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10" cy="-94" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-7 -93 Q0 -84 7 -93 Z" fill="#fff"/>
      <!-- cap -->
      <path d="M-21 -109 Q-23 -128 0 -129 Q23 -128 21 -109 Z" fill="#3b5ba5"/>
      <path d="M-20 -109 H20" fill="none" stroke-width="5"/>
      <path d="M-18 -109 Q0 -113 18 -109 Q12 -104 0 -104 Q-12 -104 -18 -109 Z" fill="#2b2622"/>
      <circle cx="0" cy="-119" r="4" fill="#f2c14e" stroke-width="2"/>
