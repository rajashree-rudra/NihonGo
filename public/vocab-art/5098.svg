<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="umbrella">
  <!-- 傘 (umbrella): an open red umbrella with a hooked handle, rain falling around it -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- rain drops -->
    <g fill="#3b5ba5" stroke-width="2">
      <path d="M32 34 Q39 44 32 48 Q25 44 32 34 Z"/>
      <path d="M128 30 Q135 40 128 44 Q121 40 128 30 Z"/>
      <path d="M30 100 Q37 110 30 114 Q23 110 30 100 Z"/>
      <path d="M130 98 Q137 108 130 112 Q123 108 130 98 Z"/>
      <path d="M44 124 Q51 134 44 138 Q37 134 44 124 Z"/>
      <path d="M116 122 Q123 132 116 136 Q109 132 116 122 Z"/>
    </g>
    <!-- shaft and hooked handle -->
    <path d="M80 80 V128 Q80 140 69 140 Q60 140 60 131" fill="none" stroke="#2b2622" stroke-width="9"/>
    <path d="M80 80 V128 Q80 140 69 140 Q60 140 60 131" fill="none" stroke="#c9a26b" stroke-width="4"/>
    <!-- tip -->
    <path d="M80 30 V20" stroke-width="4"/>
    <!-- canopy -->
    <path d="M22 84 Q22 32 80 30 Q138 32 138 84 Q128.3 74 118.7 84 Q109 74 99.3 84 Q89.7 74 80 84 Q70.3 74 60.7 84 Q51 74 41.3 84 Q31.7 74 22 84 Z" fill="#d9534a"/>
    <path d="M80 31 Q50 44 41.3 84 M80 31 Q68 50 60.7 84 M80 31 V84 M80 31 Q92 50 99.3 84 M80 31 Q110 44 118.7 84" fill="none" stroke-width="2"/>
  </g>
</svg>
