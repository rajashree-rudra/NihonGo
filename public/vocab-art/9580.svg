<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="gate">
  <!-- 門 (gate): a wooden gate with a tiled roof, its two doors open and a path going through -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="137" rx="62" ry="6" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- path through the gate -->
    <path d="M62 100 H98 L112 138 H48 Z" fill="#efe6dc"/>
    <!-- open doors -->
    <path d="M50 64 L64 72 V128 L50 136 Z" fill="#c9a26b"/>
    <path d="M110 64 L96 72 V128 L110 136 Z" fill="#c9a26b"/>
    <path d="M50 64 L64 72 V128 L50 136 Z M110 64 L96 72 V128 L110 136 Z" fill="#2b2622" opacity=".15" stroke="none"/>
    <path d="M57 84 V122 M103 84 V122" fill="none" stroke-width="1.8" opacity=".5"/>
    <!-- pillars on stones -->
    <rect x="36" y="58" width="14" height="76" fill="#c9a26b"/>
    <rect x="110" y="58" width="14" height="76" fill="#c9a26b"/>
    <rect x="32" y="130" width="22" height="8" rx="2" fill="#9a958b"/>
    <rect x="106" y="130" width="22" height="8" rx="2" fill="#9a958b"/>
    <!-- crossbeam -->
    <rect x="28" y="56" width="104" height="10" rx="2" fill="#c9a26b"/>
    <!-- tiled roof -->
    <path d="M12 58 Q28 54 34 38 H126 Q132 54 148 58 Z" fill="#6f6a60"/>
    <path d="M50 40 L46 56 M68 40 L66 56 M80 40 V56 M92 40 L94 56 M110 40 L114 56" fill="none" stroke-width="1.8" opacity=".6"/>
    <rect x="38" y="28" width="84" height="11" rx="4" fill="#3d3a4a"/>
  </g>
</svg>
