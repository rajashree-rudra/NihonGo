<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="place">
  <!-- 所 (place): a folded map with a big red pin marking one spot -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="80" cy="84" r="58" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- folded map -->
    <path d="M18 66 L56 56 V132 L18 142 Z" fill="#c5e2cf"/>
    <path d="M56 56 L104 66 V142 L56 132 Z" fill="#e1f1e6"/>
    <path d="M104 66 L142 56 V132 L104 142 Z" fill="#c5e2cf"/>
    <!-- river and roads on the map -->
    <path d="M30 63 Q36 90 26 104 Q22 116 30 140" fill="none" stroke="#3b5ba5" stroke-width="4" opacity=".7"/>
    <path d="M20 100 L56 92 L104 104 L140 92" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M122 61 V137" fill="none" stroke="#fff" stroke-width="5"/>
    <!-- the place: pin with its shadow -->
    <ellipse cx="80" cy="112" rx="10" ry="3.5" fill="#2b2622" opacity=".3" stroke="none"/>
    <path d="M80 112 Q60 88 60 72 Q60 50 80 50 Q100 50 100 72 Q100 88 80 112 Z" fill="#d9534a"/>
    <circle cx="80" cy="72" r="8" fill="#fff"/>
  </g>
</svg>
