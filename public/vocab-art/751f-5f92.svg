<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="pupil, student (school)">
  <!-- 生徒 (pupil): a student in a sailor-style school uniform at a desk, raising a hand, the same chalkboard as 先生 behind -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <ellipse cx="80" cy="141" rx="56" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- chalkboard -->
    <rect x="14" y="12" width="132" height="54" rx="4" fill="#c9a26b"/>
    <rect x="20" y="18" width="120" height="42" rx="2" fill="#4f8a5b"/>
    <g fill="none" stroke="#fff" stroke-width="2.5">
      <circle cx="34" cy="31" r="7"/>
      <path d="M118 38 L125 24 L132 38 Z"/>
      <path d="M28 50 Q34 44 40 50 T52 50"/>
      <path d="M110 50 Q116 44 122 50 T134 50"/>
    </g>
    <!-- student -->
    <g transform="translate(80 150) scale(.9)">
      <rect x="-27" y="-78" width="9" height="40" rx="4.5" fill="#fff"/>
      <path d="M-20 -104 Q-24 -82 -18 -72 H18 Q24 -82 20 -104 Z" fill="#2b2622"/>
      <path d="M-20 -46 V-70 Q-20 -81 -9 -81 H9 Q20 -81 20 -70 V-46 Z" fill="#fff"/>
      <!-- sailor collar and red scarf -->
      <path d="M-15 -81 L0 -53 L15 -81 H9 L0 -62 L-9 -81 Z" fill="#3b5ba5"/>
      <path d="M0 -56 L-7 -61 V-50 Z M0 -56 L7 -61 V-50 Z" fill="#d9534a" stroke-width="2"/>
      <!-- raised hand -->
      <path d="M16 -76 L25 -112" stroke-width="11.5"/>
      <path d="M16 -76 L25 -112" stroke="#fff" stroke-width="6.5"/>
      <circle cx="26" cy="-116" r="5.5" fill="#f6d3b3"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-19 -100 Q-21 -125 0 -125 Q21 -125 19 -100 Q15 -112 6 -113 Q0 -108 -6 -113 Q-15 -112 -19 -100 Z" fill="#2b2622"/>
      <circle cx="-6" cy="-101" r="2.3" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-101" r="2.3" fill="#2b2622" stroke="none"/>
      <circle cx="-10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-6 -93 Q0 -86 6 -93 Z" fill="#fff"/>
    </g>
    <!-- desk with a notebook -->
    <rect x="40" y="114" width="6" height="26" fill="#9aa3b0"/>
    <rect x="114" y="114" width="6" height="26" fill="#9aa3b0"/>
    <rect x="30" y="106" width="100" height="10" rx="2" fill="#c9a26b"/>
    <path d="M52 106 L56 98 H80 L76 106 Z" fill="#fff"/>
    <path d="M64 98 L60 106" fill="none" stroke-width="2"/>
    <circle cx="58" cy="104" r="5" fill="#f6d3b3"/>
  </g>
</svg>
