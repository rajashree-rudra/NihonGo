<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="candy, sweet">
  <!-- 飴 (candy): a swirly lollipop and two hard candies in twisted wrappers -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="80" cy="82" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="136" rx="58" ry="6" fill="#f1cfc7"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- lollipop -->
    <path d="M106 80 V134" fill="none" stroke-width="9"/>
    <path d="M106 80 V134" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="106" cy="56" r="24" fill="#d9534a"/>
    <path d="M106 56 a4 4 0 0 1 8 0 a8 8 0 0 1 -16 0 a12 12 0 0 1 24 0 a16 16 0 0 1 -32 0 a20 20 0 0 1 40 0" fill="none" stroke="#fff" stroke-width="4"/>
    <circle cx="106" cy="56" r="24" fill="none"/>
    <!-- wrapped candy (gold) -->
    <g transform="translate(52 104) rotate(-18)">
      <path d="M-14 -6 L-34 -18 Q-29 0 -34 18 L-14 6 Z M14 -6 L34 -18 Q29 0 34 18 L14 6 Z" fill="#f8dc8a"/>
      <path d="M-26 -10 L-24 10 M26 -10 L24 10" fill="none" stroke-width="1.8" opacity=".5"/>
      <circle r="16" fill="#f2a93b"/>
      <path d="M-8 -8 Q-4 -12 2 -11" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <!-- wrapped candy (green) -->
    <g transform="translate(118 122) rotate(12) scale(.72)">
      <path d="M-14 -6 L-34 -18 Q-29 0 -34 18 L-14 6 Z M14 -6 L34 -18 Q29 0 34 18 L14 6 Z" fill="#c5e2cf"/>
      <circle r="16" fill="#4f8a5b"/>
      <path d="M-8 -8 Q-4 -12 2 -11" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
  </g>
</svg>
