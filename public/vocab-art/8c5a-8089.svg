<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="pork">
  <!-- 豚肉 (pork): pink striped slices of pork on a plate, with a pig-face badge showing which animal -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="86" cy="92" r="50" fill="#fff" opacity=".55"/>
  <ellipse cx="88" cy="138" rx="56" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- plate -->
    <ellipse cx="90" cy="114" rx="60" ry="22" fill="#fff"/>
    <ellipse cx="90" cy="114" rx="46" ry="15" fill="none" opacity=".25"/>
    <!-- pork slices with stripes of fat -->
    <g transform="translate(96 96) rotate(8)">
      <rect x="-40" y="-11" width="80" height="22" rx="7" fill="#f4a3a0"/>
      <path d="M-38 -3 Q-20 -7 0 -3 Q20 1 38 -3 M-38 5 Q-20 1 0 5 Q20 9 38 5" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <g transform="translate(84 116) rotate(-6)">
      <rect x="-40" y="-11" width="80" height="22" rx="7" fill="#f4a3a0"/>
      <path d="M-38 -3 Q-20 -7 0 -3 Q20 1 38 -3 M-38 5 Q-20 1 0 5 Q20 9 38 5" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <!-- badge: pig face -->
    <g transform="translate(38 40)">
      <circle r="25" fill="#9cc27a"/>
      <path d="M-13 -9 L-15 -21 L-4 -14 Z" fill="#f4a3a0"/>
      <path d="M13 -9 L15 -21 L4 -14 Z" fill="#f4a3a0"/>
      <ellipse cx="0" cy="0" rx="15" ry="13.5" fill="#f4a3a0"/>
      <circle cx="-6" cy="-4" r="1.8" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-4" r="1.8" fill="#2b2622" stroke="none"/>
      <ellipse cx="0" cy="5" rx="7" ry="5" fill="#e9837f"/>
      <ellipse cx="-2.5" cy="5" rx="1.3" ry="2" fill="#2b2622" stroke="none"/>
      <ellipse cx="2.5" cy="5" rx="1.3" ry="2" fill="#2b2622" stroke="none"/>
    </g>
  </g>
</svg>
