  <circle cx="80" cy="78" r="56" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- board -->
    <rect x="16" y="114" width="128" height="14" rx="5" fill="#c9a26b"/>
    <!-- bread loaf and a cut slice -->
    <path d="M64 114 V96 Q64 84 78 84 H122 Q136 84 136 98 V114 Z" fill="#f2c14e"/>
    <path d="M86 88 L82 96 M102 88 L98 96 M118 88 L114 96" fill="none" stroke-width="2"/>
    <g transform="rotate(-10 42 114)">
      <path d="M28 114 V96 Q22 92 24 86 Q26 78 36 80 Q42 76 48 80 Q58 78 58 86 Q60 92 54 96 V114 Z" fill="#f2c14e"/>
      <path d="M32 111 V94 Q28 91 29 87 Q30 83 37 84 Q42 81 46 84 Q53 83 54 87 Q55 91 50 94 V111 Z" fill="#f8edd6" stroke="none"/>
    </g>
    <!-- knife -->
    <g transform="translate(86 56) rotate(-10) scale(-1 1)">
      <path d="M-10 -11 H48 Q60 -11 68 -6 Q56 8 40 8 H-10 Z" fill="#d8d3ca"/>
      <path d="M-6 3 H40 Q52 3 60 -3" fill="none" stroke="#fff" stroke-width="2.5"/>
      <rect x="-15" y="-12" width="7" height="21" rx="2" fill="#9aa3b0"/>
      <rect x="-50" y="-8" width="37" height="14" rx="6" fill="#3d3a4a"/>
      <circle cx="-38" cy="-1" r="1.8" fill="#9aa3b0" stroke="none"/>
      <circle cx="-25" cy="-1" r="1.8" fill="#9aa3b0" stroke="none"/>
    </g>
  </g>
</svg>
