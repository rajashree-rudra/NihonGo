<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="café, coffee shop">
  <!-- 喫茶店 (café): a small shop with a striped awning and a steaming coffee cup sign on top -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="80" cy="84" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="141" rx="62" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- sign board with a coffee cup -->
    <rect x="44" y="10" width="72" height="44" rx="8" fill="#5a4636"/>
    <path d="M71 30 Q68 26 71 22 Q74 18 71 14 M86 30 Q83 26 86 22 Q89 18 86 14" fill="none" stroke="#fff" stroke-width="2"/>
    <ellipse cx="78" cy="47" rx="22" ry="3.5" fill="#fff"/>
    <path d="M95 36 Q103 36 103 41 Q103 46 94 45" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M62 33 H95 V36 Q95 46 78.5 46 Q62 46 62 36 Z" fill="#fff"/>
    <!-- shop wall -->
    <rect x="24" y="58" width="112" height="80" fill="#efe6dc"/>
    <!-- door -->
    <rect x="32" y="84" width="28" height="54" rx="2" fill="#c9a26b"/>
    <rect x="37" y="90" width="18" height="22" rx="2" fill="#c7d3ea" stroke-width="2"/>
    <circle cx="54" cy="118" r="2" fill="#2b2622" stroke="none"/>
    <!-- window with a little cup and plant -->
    <rect x="68" y="84" width="60" height="38" rx="3" fill="#c7d3ea"/>
    <path d="M74 94 L84 84 M80 100 L96 84" fill="none" stroke="#fff" opacity=".8"/>
    <rect x="68" y="122" width="60" height="6" rx="2" fill="#c9a26b"/>
    <path d="M106 108 H118 V113 Q118 120 112 120 Q106 120 106 113 Z" fill="#fff" stroke-width="2"/>
    <!-- striped awning -->
    <rect x="18" y="52" width="124" height="8" rx="3" fill="#d9534a"/>
    <path d="M20 60 H40 V66 Q30 76 20 66 Z" fill="#d9534a"/>
    <path d="M40 60 H60 V66 Q50 76 40 66 Z" fill="#fff"/>
    <path d="M60 60 H80 V66 Q70 76 60 66 Z" fill="#d9534a"/>
    <path d="M80 60 H100 V66 Q90 76 80 66 Z" fill="#fff"/>
    <path d="M100 60 H120 V66 Q110 76 100 66 Z" fill="#d9534a"/>
    <path d="M120 60 H140 V66 Q130 76 120 66 Z" fill="#fff"/>
  </g>
</svg>
