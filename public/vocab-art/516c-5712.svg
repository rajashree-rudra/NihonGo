<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="park">
  <!-- 公園 (park): two round trees, a wooden bench and flowers on the grass -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="80" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="138" rx="68" ry="10" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- big tree -->
    <path d="M33 138 V74 H44 V138 Z" fill="#c9a26b"/>
    <path d="M14 68 Q6 50 20 40 Q24 24 42 26 Q58 26 63 42 Q72 58 62 72 Q54 84 38 82 Q20 84 14 68 Z" fill="#4f8a5b"/>
    <path d="M22 50 Q26 38 38 36" fill="none" stroke="#fff" opacity=".6"/>
    <!-- small tree -->
    <path d="M117 138 V86 H126 V138 Z" fill="#c9a26b"/>
    <path d="M102 84 Q96 68 108 61 Q112 50 125 52 Q139 54 141 67 Q146 81 134 89 Q124 95 113 93 Q103 91 102 84 Z" fill="#4f8a5b"/>
    <path d="M109 70 Q112 61 121 60" fill="none" stroke="#fff" opacity=".6"/>
    <!-- bench -->
    <rect x="64" y="96" width="5" height="42" rx="2" fill="#3d3a4a"/>
    <rect x="98" y="96" width="5" height="42" rx="2" fill="#3d3a4a"/>
    <rect x="56" y="98" width="55" height="8" rx="3" fill="#c9a26b"/>
    <rect x="56" y="109" width="55" height="8" rx="3" fill="#c9a26b"/>
    <rect x="52" y="121" width="63" height="7" rx="3" fill="#c9a26b"/>
    <!-- flowers -->
    <circle cx="22" cy="134" r="4" fill="#d9534a"/>
    <circle cx="140" cy="134" r="4" fill="#f2c14e"/>
    <circle cx="133" cy="139" r="3.5" fill="#d9534a"/>
  </g>
</svg>
