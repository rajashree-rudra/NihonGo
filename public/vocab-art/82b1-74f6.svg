<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="(flower) vase">
  <!-- 花瓶 (vase): a round blue vase with three flowers in it -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="82" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="140" rx="40" ry="5" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- stems and leaves -->
    <path d="M76 84 Q70 60 52 42 M80 84 V30 M84 84 Q92 62 108 46" fill="none" stroke="#4f8a5b" stroke-width="3.5"/>
    <path d="M66 64 Q54 62 50 70 Q60 74 66 64 Z" fill="#4f8a5b"/>
    <path d="M94 66 Q106 62 110 70 Q100 75 94 66 Z" fill="#4f8a5b"/>
    <!-- flowers -->
    <g transform="translate(50 40)" fill="#d9534a">
      <circle cx="0" cy="-8" r="7"/><circle cx="7.6" cy="-2.5" r="7"/><circle cx="4.7" cy="6.5" r="7"/><circle cx="-4.7" cy="6.5" r="7"/><circle cx="-7.6" cy="-2.5" r="7"/>
      <circle r="5" fill="#f2c14e"/>
    </g>
    <g transform="translate(80 28)" fill="#fff">
      <circle cx="0" cy="-8" r="7"/><circle cx="7.6" cy="-2.5" r="7"/><circle cx="4.7" cy="6.5" r="7"/><circle cx="-4.7" cy="6.5" r="7"/><circle cx="-7.6" cy="-2.5" r="7"/>
      <circle r="5" fill="#f2c14e"/>
    </g>
    <g transform="translate(110 44)" fill="#f2c14e">
      <circle cx="0" cy="-8" r="7"/><circle cx="7.6" cy="-2.5" r="7"/><circle cx="4.7" cy="6.5" r="7"/><circle cx="-4.7" cy="6.5" r="7"/><circle cx="-7.6" cy="-2.5" r="7"/>
      <circle r="5" fill="#d9534a"/>
    </g>
    <!-- vase -->
    <path d="M69 80 H91 V92 Q114 102 110 122 Q106 140 80 140 Q54 140 50 122 Q46 102 69 92 Z" fill="#3b5ba5"/>
    <rect x="64" y="76" width="32" height="8" rx="3" fill="#3b5ba5"/>
    <path d="M52 112 Q66 106 80 112 Q94 118 108 112" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M58 104 Q56 112 58 120" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>
  </g>
</svg>
