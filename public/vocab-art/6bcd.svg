<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="(my) mother">
  <!-- 母 (my mother): mum with a hair bun and an apron, in colour, holding the hand of her grey child -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="60" cy="86" r="50" fill="#fff" opacity=".55"/>
  <ellipse cx="82" cy="141" rx="60" ry="6" fill="#f1cfc7"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- child (grey) -->
    <g transform="translate(114 140) scale(.64)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#6f6a60"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#6f6a60"/>
      <rect x="-13" y="-38" width="10" height="35" rx="4" fill="#9a958b"/>
      <rect x="3" y="-38" width="10" height="35" rx="4" fill="#9a958b"/>
      <rect x="17" y="-74" width="10" height="34" rx="5" fill="#d8d3ca"/>
      <circle cx="22" cy="-38" r="5.5" fill="#efe6dc"/>
      <path d="M-19 -36 V-67 Q-19 -77 -9 -77 H9 Q19 -77 19 -67 V-36 Z" fill="#d8d3ca"/>
      <circle cx="0" cy="-96" r="18" fill="#efe6dc"/>
      <path d="M-18 -97 Q-19 -117 0 -117 Q19 -117 18 -97 Q12 -107 0 -106 Q-11 -106 -18 -97 Z" fill="#6f6a60"/>
      <circle cx="-6" cy="-95" r="2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-95" r="2" fill="#2b2622" stroke="none"/>
      <path d="M-5 -88 Q0 -84 5 -88" fill="none"/>
    </g>
    <!-- child's arm reaching up to mum's hand -->
    <path d="M100 95 L91 101" stroke="#2b2622" stroke-width="8.5"/>
    <path d="M100 95 L91 101" stroke="#d8d3ca" stroke-width="4"/>
    <!-- mother (colour) -->
    <g transform="translate(60 140)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-12" y="-36" width="9" height="33" rx="4" fill="#f6d3b3"/>
      <rect x="3" y="-36" width="9" height="33" rx="4" fill="#f6d3b3"/>
      <rect x="-27" y="-78" width="9" height="36" rx="4.5" fill="#f2c14e"/>
      <circle cx="-22.5" cy="-40" r="5.5" fill="#f6d3b3"/>
      <path d="M-15 -81 H15 L25 -31 H-25 Z" fill="#f2c14e"/>
      <!-- apron -->
      <path d="M-7 -78 H7 V-66 H11 L14 -35 H-14 L-11 -66 H-7 Z" fill="#fff"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <!-- bun -->
      <circle cx="0" cy="-127" r="8" fill="#5a4636"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-19 -98 Q-21 -125 0 -125 Q21 -125 19 -98 Q17 -110 8 -113 Q-4 -114 -12 -109 Q-17 -105 -19 -98 Z" fill="#5a4636"/>
      <circle cx="-6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-6 -93 Q0 -87 6 -93" fill="none"/>
    </g>
    <!-- mum's arm down to hold the child's hand -->
    <path d="M75 64 L88 98" stroke="#2b2622" stroke-width="11.5"/>
    <path d="M75 64 L88 98" stroke="#f2c14e" stroke-width="6.5"/>
    <circle cx="89" cy="101" r="5.5" fill="#f6d3b3"/>
  </g>
</svg>
