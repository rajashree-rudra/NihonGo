<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="newspaper">
  <!-- 新聞 (newspaper): a folded newspaper with a big headline bar, a photo and columns of print -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="80" cy="82" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="82" cy="140" rx="50" ry="5" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="rotate(-6 80 82)">
    <!-- back pages -->
    <rect x="36" y="30" width="96" height="106" rx="3" fill="#d8d3ca"/>
    <!-- front page -->
    <rect x="28" y="24" width="96" height="110" rx="3" fill="#fff"/>
    <!-- masthead and headline -->
    <rect x="38" y="33" width="76" height="11" rx="2" fill="#2b2622"/>
    <path d="M38 52 H114" fill="none" stroke-width="5"/>
    <!-- photo -->
    <rect x="38" y="62" width="38" height="30" rx="2" fill="#e3eaf6"/>
    <path d="M39 91 L52 76 L60 84 L66 78 L75 91 Z" fill="#4f8a5b" stroke-width="2"/>
    <circle cx="67" cy="70" r="4" fill="#f2c14e" stroke-width="2"/>
    <!-- columns of print -->
    <g fill="none" stroke="#9a958b" stroke-width="3">
      <path d="M84 64 H114 M84 72 H114 M84 80 H114 M84 88 H108"/>
      <path d="M38 102 H72 M38 110 H72 M38 118 H72 M38 126 H64"/>
      <path d="M80 102 H114 M80 110 H114 M80 118 H114 M80 126 H104"/>
    </g>
  </g>
</svg>
