    <circle cx="70" cy="100" r="46" fill="#3b5ba5"/>
    <g transform="translate(-2 6)">
      <path d="M36 80 Q42 64 58 62 Q70 66 66 78 Q58 84 62 96 Q60 108 48 110 Q36 100 36 80 Z" fill="#4f8a5b"/>
