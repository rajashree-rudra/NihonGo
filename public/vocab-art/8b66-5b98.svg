<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="police officer">
  <!-- 警官 (police officer): an officer in blue uniform and cap saluting in front of a police box with a red lamp -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="102" cy="86" r="50" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="141" rx="66" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- police box -->
    <rect x="14" y="62" width="42" height="78" fill="#fff"/>
    <path d="M9 62 H61 L56 50 H14 Z" fill="#3b5ba5"/>
    <rect x="30" y="42" width="10" height="8" fill="#3d3a4a"/>
    <circle cx="35" cy="38" r="6" fill="#d9534a"/>
    <circle cx="35" cy="77" r="6" fill="#f2c14e"/>
    <rect x="23" y="94" width="24" height="46" fill="#9aa3b0"/>
    <path d="M35 94 V140" fill="none"/>
    <!-- officer -->
    <g transform="translate(102 140)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-13" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="3" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="-28" y="-78" width="10" height="36" rx="5" fill="#3b5ba5"/>
      <circle cx="-23" cy="-40" r="5.5" fill="#f6d3b3"/>
      <path d="M-20 -38 V-70 Q-20 -81 -9 -81 H9 Q20 -81 20 -70 V-38 Z" fill="#3b5ba5"/>
      <path d="M-8 -81 L0 -68 L8 -81 Z" fill="#fff"/>
      <path d="M0 -78 L-2.5 -72 L0 -65 L2.5 -72 Z" fill="#3d3a4a" stroke-width="1.6"/>
      <circle cx="-11" cy="-65" r="3.5" fill="#f2c14e" stroke-width="2"/>
      <rect x="-20" y="-47" width="40" height="7" fill="#3d3a4a"/>
      <rect x="-3.5" y="-48" width="7" height="9" rx="1.5" fill="#f2c14e" stroke-width="2"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <circle cx="-6" cy="-100" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-100" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10" cy="-94" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10" cy="-94" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-6 -92 Q0 -86 6 -92" fill="none"/>
      <!-- cap -->
      <path d="M-21 -109 Q-23 -128 0 -129 Q23 -128 21 -109 Z" fill="#3b5ba5"/>
      <path d="M-20 -109 H20" fill="none" stroke-width="5"/>
      <path d="M-18 -109 Q0 -113 18 -109 Q12 -104 0 -104 Q-12 -104 -18 -109 Z" fill="#2b2622"/>
      <circle cx="0" cy="-119" r="4" fill="#f2c14e" stroke-width="2"/>
      <!-- saluting arm -->
      <path d="M16 -76 L35 -90 L21 -107" fill="none" stroke-width="12"/>
      <path d="M16 -76 L35 -90 L21 -107" fill="none" stroke="#3b5ba5" stroke-width="7"/>
      <ellipse cx="18" cy="-109" rx="7" ry="4.5" fill="#f6d3b3" transform="rotate(-35 18 -109)"/>
    </g>
  </g>
</svg>
