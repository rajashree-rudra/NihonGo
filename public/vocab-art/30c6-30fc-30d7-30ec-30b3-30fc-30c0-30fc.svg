<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="tape recorder">
  <!-- テープレコーダー (tape recorder): a portable cassette recorder with a cassette behind its window, piano-key buttons (one red record key), a speaker and music -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="88" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="136" rx="58" ry="6" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- music note -->
    <path d="M124 34 V18 L138 15 V31" fill="none" stroke-width="2.5"/>
    <ellipse cx="121.5" cy="34.5" rx="3.6" ry="2.8" fill="#2b2622"/>
    <ellipse cx="135.5" cy="31.5" rx="3.6" ry="2.8" fill="#2b2622"/>
    <!-- piano keys -->
    <rect x="34" y="36" width="12" height="14" rx="2" fill="#d9534a"/>
    <rect x="48" y="36" width="12" height="14" rx="2" fill="#efe6dc"/>
    <rect x="62" y="38" width="12" height="12" rx="2" fill="#efe6dc"/>
    <rect x="76" y="36" width="12" height="14" rx="2" fill="#efe6dc"/>
    <rect x="90" y="36" width="12" height="14" rx="2" fill="#efe6dc"/>
    <!-- body -->
    <rect x="22" y="46" width="116" height="86" rx="10" fill="#3d3a4a"/>
    <!-- cassette window -->
    <rect x="31" y="56" width="68" height="66" rx="6" fill="#9aa3b0"/>
    <g transform="translate(65 89)">
      <rect x="-28" y="-20" width="56" height="38" rx="3" fill="#fff"/>
      <rect x="-22" y="-15" width="44" height="22" rx="2.5" fill="#f2c14e" stroke-width="2"/>
      <rect x="-15" y="-9" width="30" height="11" rx="5.5" fill="#3d3a4a" stroke-width="1.8"/>
      <circle cx="-8" cy="-3.5" r="3.6" fill="#fff" stroke-width="1.6"/>
      <circle cx="8" cy="-3.5" r="3.6" fill="#fff" stroke-width="1.6"/>
      <path d="M-14 18 L-11 11 H11 L14 18" fill="none" stroke-width="2"/>
    </g>
    <!-- speaker grille -->
    <path d="M108 60 H128 M108 68 H128 M108 76 H128 M108 84 H128 M108 92 H128" fill="none" stroke="#9a958b" stroke-width="3"/>
    <!-- red record light and volume -->
    <circle cx="112" cy="108" r="3.5" fill="#d9534a" stroke-width="1.8"/>
    <circle cx="125" cy="110" r="6" fill="#9aa3b0"/>
  </g>
</svg>
