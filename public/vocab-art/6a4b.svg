<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="bridge">
  <!-- 橋 (bridge): a red arched bridge over a little river -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="74" r="54" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 -7)">
    <!-- river -->
    <ellipse cx="80" cy="122" rx="62" ry="17" fill="#3b5ba5"/>
    <path d="M44 124 Q50 120 56 124 Q62 128 68 124 M92 128 Q98 124 104 128 Q110 132 116 128 M70 134 Q76 130 82 134" fill="none" stroke="#fff" stroke-width="2.2" opacity=".85"/>
    <!-- posts -->
    <g>
      <path d="M18 82 V100 M28 77 V93 M54 63 V81 M80 58 V77 M106 63 V81 M132 77 V93 M142 82 V100" stroke-width="8"/>
      <path d="M18 82 V100 M28 77 V93 M54 63 V81 M80 58 V77 M106 63 V81 M132 77 V93 M142 82 V100" stroke="#d9534a" stroke-width="3.5"/>
    </g>
    <!-- top rail -->
    <path d="M16 88 Q80 32 144 88" fill="none" stroke-width="8"/>
    <path d="M16 88 Q80 32 144 88" fill="none" stroke="#d9534a" stroke-width="3.5"/>
    <!-- knobs on the end posts -->
    <circle cx="18" cy="80" r="4.5" fill="#f2c14e"/>
    <circle cx="142" cy="80" r="4.5" fill="#f2c14e"/>
    <!-- arched deck -->
    <path d="M12 104 Q80 48 148 104 L148 114 Q80 66 12 114 Z" fill="#d9534a"/>
    <!-- feet on the banks -->
    <rect x="6" y="110" width="16" height="8" rx="2" fill="#9a958b"/>
    <rect x="138" y="110" width="16" height="8" rx="2" fill="#9a958b"/>
  </g>
</svg>
