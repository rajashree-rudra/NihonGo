<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="butter">
  <!-- バター (butter): a pale yellow block of butter on a dish, with a butter knife carrying a curl of butter -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="136" rx="62" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- dish -->
    <path d="M14 104 H146 V114 Q146 126 134 126 H26 Q14 126 14 114 Z" fill="#9ab7de"/>
    <path d="M14 104 Q14 96 22 96 H138 Q146 96 146 104 Q146 110 138 110 H22 Q14 110 14 104 Z" fill="#fff"/>
    <!-- butter block: top, side, front -->
    <path d="M30 70 L48 54 H118 L100 70 Z" fill="#fff4c6"/>
    <path d="M100 70 L118 54 V86 L100 104 Z" fill="#f2d57a"/>
    <rect x="30" y="70" width="70" height="34" fill="#fbe7a1"/>
    <path d="M38 78 H58" fill="none" stroke="#fff" stroke-width="3.5" opacity=".9"/>
    <!-- butter knife -->
    <g transform="rotate(-18 108 128)">
      <path d="M62 124 Q64 118 72 118 H104 V128 H70 Q62 128 62 124 Z" fill="#d8d3ca"/>
      <rect x="104" y="119" width="38" height="9" rx="4.5" fill="#c9a26b"/>
      <path d="M70 118 Q72 112 80 113 Q84 108 90 112 Q96 112 94 118 Z" fill="#fbe7a1"/>
    </g>
  </g>
</svg>
