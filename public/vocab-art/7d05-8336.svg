<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="black tea">
  <!-- 紅茶 (black tea): a teacup of red-brown tea on a saucer, the tea bag's tag hanging over the side -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="134" rx="56" ry="6" fill="#f1cfc7"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- steam -->
    <g fill="none" stroke="#9a958b" stroke-width="3">
      <path d="M68 66 Q64 60 68 54 Q72 48 68 42"/>
      <path d="M86 66 Q82 60 86 54 Q90 48 86 42"/>
    </g>
    <!-- saucer -->
    <ellipse cx="80" cy="124" rx="50" ry="10" fill="#fff"/>
    <ellipse cx="80" cy="122" rx="26" ry="4.5" fill="none" opacity=".3"/>
    <!-- handle -->
    <path d="M112 86 Q134 84 130 100 Q126 112 108 110" fill="none" stroke-width="11"/>
    <path d="M112 86 Q134 84 130 100 Q126 112 108 110" fill="none" stroke="#fff" stroke-width="5.5"/>
    <!-- cup -->
    <path d="M38 78 H118 Q118 112 92 120 H64 Q38 112 38 78 Z" fill="#fff"/>
    <path d="M41 92 H115" fill="none" stroke="#d9534a" stroke-width="5"/>
    <ellipse cx="78" cy="78" rx="40" ry="8" fill="#fff"/>
    <ellipse cx="78" cy="79" rx="34" ry="5.5" fill="#b5523a" stroke-width="2"/>
    <!-- tea bag string and tag -->
    <path d="M60 79 Q48 66 42 80 L36 98" fill="none" stroke-width="1.8"/>
    <rect x="27" y="97" width="14" height="16" rx="2" fill="#f2c14e" transform="rotate(8 34 105)"/>
  </g>
</svg>
