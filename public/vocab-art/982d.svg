<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="head">
  <!-- 頭 (head): a big smiling head with a gold glow around the whole head, and a red arrow pointing at the top of it -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- glow around the head -->
    <circle cx="78" cy="78" r="52" fill="#f2c14e" opacity=".45" stroke="none"/>
    <!-- neck and shoulders -->
    <rect x="69" y="104" width="18" height="24" fill="#f6d3b3"/>
    <path d="M28 162 Q28 134 54 128 Q66 125 78 125 Q90 125 102 128 Q128 134 128 162 Z" fill="#d9534a"/>
    <path d="M68 126 L78 136 L88 126" fill="none" stroke="#fff"/>
    <!-- head (the same person, close up) -->
    <g transform="translate(78 82) scale(2.05)" stroke-width="1.22">
      <circle cx="-18" cy="2" r="4.5" fill="#f6d3b3"/>
      <circle cx="18" cy="2" r="4.5" fill="#f6d3b3"/>
      <circle r="18" fill="#f6d3b3"/>
      <path d="M-18 -1 Q-19 -22 0 -22 Q20 -22 18 0 Q14 -9 4 -10 Q-2 -6 -8 -9 Q-14 -7 -18 -1 Z" fill="#2b2622"/>
      <circle cx="-6" cy="2" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="2" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10.5" cy="8" r="2.6" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10.5" cy="8" r="2.6" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-1.2 7 Q0 8.1 1.2 7" fill="none"/>
      <path d="M-4.5 11 Q0 14.5 4.5 11" fill="none"/>
    </g>
    <!-- arrow pointing down at the top of the head -->
    <path d="M0 0 L-11 -10 V-4.5 H-24 V4.5 H-11 V10 Z" fill="#d9534a" transform="translate(103 41) rotate(130)"/>
  </g>
</svg>
