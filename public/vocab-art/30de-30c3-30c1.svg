    <ellipse cx="61" cy="58" rx="6" ry="7.5" fill="#d9534a" transform="rotate(27 61 58)"/>
    <path d="M64 14 C74 28 80 38 74 48 C70 54 60 56 56 48 C52 40 60 30 64 14 Z" fill="#f2c14e"/>
    <path d="M65 32 C69 38 70 44 66 48 C63 50 59 48 59 44 C59 40 63 38 65 32 Z" fill="#d9534a" stroke-width="2"/>
  </g>
</svg>
