  <circle cx="62" cy="44" r="34" fill="#fff" opacity=".7"/>
  <ellipse cx="88" cy="132" rx="56" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- matchbox -->
    <path d="M42 98 L58 84 H136 L120 98 Z" fill="#d9534a"/>
    <path d="M42 98 L58 84 H136 L120 98 Z" fill="#fff" opacity=".2" stroke="none"/>
    <path d="M120 98 L136 84 V116 L120 130 Z" fill="#5a4636"/>
    <rect x="42" y="98" width="78" height="32" fill="#d9534a"/>
    <rect x="58" y="104" width="46" height="20" rx="4" fill="#fff"/>
    <path d="M81 108 Q88 114 84 120 H78 Q74 114 81 108 Z" fill="#f2c14e" stroke-width="1.8"/>
