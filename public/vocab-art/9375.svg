<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="key; lock">
  <!-- 鍵 (key; lock): a gold key beside a locked padlock -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="80" cy="82" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="54" cy="130" rx="32" ry="5" fill="#f1cfc7"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- padlock -->
    <path d="M36 80 V62 Q36 42 54 42 Q72 42 72 62 V80" fill="none" stroke="#2b2622" stroke-width="12"/>
    <path d="M36 80 V62 Q36 42 54 42 Q72 42 72 62 V80" fill="none" stroke="#9aa3b0" stroke-width="7"/>
    <rect x="24" y="76" width="60" height="52" rx="9" fill="#3b5ba5"/>
    <circle cx="54" cy="96" r="6" fill="#2b2622"/>
    <path d="M51 98 L49 112 H59 L57 98 Z" fill="#2b2622"/>
    <!-- key -->
    <g transform="translate(124 44) rotate(-60)">
      <path d="M-12 -5 H-64 V15 H-54 V5 H-47 V12 H-38 V5 H-12 Z" fill="#f2c14e"/>
      <circle r="17" fill="#f2c14e"/>
      <circle r="6.5" fill="#fbe6e1"/>
    </g>
  </g>
</svg>
