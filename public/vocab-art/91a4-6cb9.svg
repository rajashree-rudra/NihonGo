<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="soy sauce">
  <!-- 醤油 (soy sauce): a glass soy sauce bottle with a red spout cap, full of dark sauce, and a little dish of it -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="74" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="84" cy="135" rx="62" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- bottle -->
    <path d="M56 52 H78 Q80 64 92 80 Q104 98 98 116 Q92 134 67 134 Q42 134 36 116 Q30 98 42 80 Q54 64 56 52 Z" fill="#4a2c1c"/>
    <path d="M44 92 Q42 104 46 116" fill="none" stroke="#fff" stroke-width="4" opacity=".55"/>
    <!-- red cap with spout -->
    <path d="M78 40 L94 34 L95 40 L80 47 Z" fill="#d9534a"/>
    <path d="M53 52 Q53 34 67 34 Q81 34 81 52 Z" fill="#d9534a"/>
    <rect x="50" y="49" width="34" height="8" rx="4" fill="#d9534a"/>
    <!-- dish -->
    <ellipse cx="122" cy="122" rx="24" ry="9" fill="#fff"/>
    <ellipse cx="122" cy="121" rx="16" ry="5" fill="#4a2c1c" stroke-width="2"/>
    <path d="M116 120 Q119 118 123 118" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/>
  </g>
</svg>
