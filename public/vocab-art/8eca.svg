<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="car">
  <!-- 車 (car): a red car seen from the side, with a driver at the wheel -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="80" cy="80" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="122" rx="64" ry="6" fill="#f1cfc7"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 -6)">
    <!-- body -->
    <path d="M18 110 V94 Q18 84 28 83 L48 81 L61 62 Q64 58 69 58 H100 Q105 58 108 62 L122 81 L134 83 Q142 85 142 96 V110 Q142 114 138 114 H22 Q18 114 18 110 Z" fill="#d9534a"/>
    <!-- windows and the driver -->
    <path d="M55 80 L66 64 H83 V80 Z" fill="#e3eaf6"/>
    <path d="M88 64 H101 Q104 64 106 67 L115 80 H88 Z" fill="#e3eaf6"/>
    <circle cx="99" cy="73" r="7" fill="#f6d3b3" stroke-width="2"/>
    <path d="M92.5 71 Q92 65 99 65 Q106 65 106 70 Q101 67.5 92.5 71 Z" fill="#2b2622" stroke-width="1.5"/>
    <circle cx="102" cy="73" r="1.3" fill="#2b2622" stroke="none"/>
    <path d="M88 64 H101 Q104 64 106 67 L115 80 H88 Z" fill="none"/>
    <!-- door, handle and lights -->
    <path d="M85 82 V110" fill="none" opacity=".4"/>
    <path d="M90 90 H97" fill="none"/>
    <path d="M136 90 Q141 90 141 95 H136 Z" fill="#f2c14e" stroke-width="2"/>
    <rect x="18" y="90" width="5" height="7" rx="1" fill="#fff" stroke-width="2"/>
    <!-- wheels -->
    <circle cx="49" cy="114" r="13" fill="#3d3a4a"/>
    <circle cx="49" cy="114" r="5" fill="#9aa3b0"/>
    <circle cx="112" cy="114" r="13" fill="#3d3a4a"/>
    <circle cx="112" cy="114" r="5" fill="#9aa3b0"/>
  </g>
</svg>
