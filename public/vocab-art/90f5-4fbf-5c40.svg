<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="post office">
  <!-- 郵便局 (post office): a building with a round red post-mark sign, an envelope in the window and a red postbox by the door -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="137" rx="62" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- building -->
    <rect x="22" y="56" width="116" height="80" rx="2" fill="#efe6dc"/>
    <rect x="18" y="50" width="124" height="10" rx="3" fill="#d9534a"/>
    <!-- window with an envelope -->
    <rect x="30" y="72" width="40" height="32" rx="2" fill="#fff"/>
    <rect x="38" y="80" width="24" height="16" rx="1.5" fill="#fff"/>
    <path d="M38 80 L50 89 L62 80" fill="none"/>
    <!-- door -->
    <rect x="80" y="84" width="28" height="52" rx="2" fill="#c7d3ea"/>
    <path d="M94 84 V136" fill="none"/>
    <!-- small postbox by the door -->
    <rect x="118" y="128" width="10" height="8" fill="#3d3a4a"/>
    <rect x="114" y="100" width="18" height="30" rx="3" fill="#d9534a"/>
    <path d="M118 107 H128" fill="none" stroke-width="2.5"/>
    <!-- round post-mark sign -->
    <path d="M80 50 V44" fill="none"/>
    <circle cx="80" cy="28" r="18" fill="#d9534a"/>
    <path d="M71 21 H89 M71 28 H89 M80 28 V40" fill="none" stroke="#fff" stroke-width="4"/>
  </g>
</svg>
