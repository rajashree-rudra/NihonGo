<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="number (e.g. phone or room number)">
  <!-- 番号 (number): a finger keying a phone number into a mobile phone; the number shows as groups of dots -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="76" cy="80" r="56" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- phone -->
    <rect x="38" y="8" width="76" height="144" rx="14" fill="#3d3a4a"/>
    <path d="M68 15 H84" fill="none" stroke="#9aa3b0" stroke-width="3"/>
    <rect x="44" y="22" width="64" height="122" rx="6" fill="#fff"/>
    <!-- the number being typed -->
    <rect x="49" y="28" width="54" height="17" rx="4" fill="#e3eaf6" stroke-width="2"/>
    <g fill="#2b2622" stroke="none">
      <circle cx="55" cy="36.5" r="2.2"/><circle cx="61" cy="36.5" r="2.2"/><circle cx="67" cy="36.5" r="2.2"/>
      <circle cx="79" cy="36.5" r="2.2"/><circle cx="85" cy="36.5" r="2.2"/><circle cx="91" cy="36.5" r="2.2"/>
    </g>
    <path d="M71 36.5 H75" fill="none" stroke-width="1.8"/>
    <path d="M97 31.5 V41.5" fill="none" stroke="#3b5ba5" stroke-width="2"/>
    <!-- keypad -->
    <g fill="#d8d3ca">
      <circle cx="56" cy="58" r="7"/><circle cx="76" cy="58" r="7"/><circle cx="96" cy="58" r="7"/>
      <circle cx="56" cy="77" r="7"/><circle cx="76" cy="77" r="7"/><circle cx="96" cy="77" r="7"/>
      <circle cx="56" cy="96" r="7"/><circle cx="76" cy="96" r="7"/><circle cx="96" cy="96" r="7"/>
      <circle cx="56" cy="115" r="7"/><circle cx="76" cy="115" r="7"/><circle cx="96" cy="115" r="7"/>
    </g>
    <circle cx="96" cy="77" r="7" fill="#f2c14e"/>
    <!-- green call button with a handset -->
    <circle cx="76" cy="133" r="8" fill="#4f8a5b"/>
    <path d="M72 130 Q71 136 80 137" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- hand pressing a key -->
    <g transform="translate(98 80) rotate(-40)">
      <rect x="-5" y="-3" width="10" height="30" rx="5" fill="#f6d3b3"/>
      <rect x="-10" y="20" width="24" height="24" rx="9" fill="#f6d3b3"/>
      <rect x="-11" y="42" width="26" height="12" rx="4" fill="#3b5ba5"/>
    </g>
  </g>
</svg>
