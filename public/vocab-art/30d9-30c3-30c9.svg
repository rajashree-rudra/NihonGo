<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="bed">
  <!-- ベッド (bed): a wooden bed seen from the side with a pillow and a blanket, a moon above -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="88" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="132" rx="64" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- moon and stars -->
    <path d="M124 18 A14 14 0 1 0 138 40 A11 11 0 1 1 124 18 Z" fill="#f2c14e"/>
    <path d="M100 26 V34 M96 30 H104" fill="none" stroke="#f2c14e" stroke-width="3"/>
    <!-- headboard and footboard -->
    <rect x="16" y="52" width="16" height="80" rx="7" fill="#c9a26b"/>
    <rect x="128" y="80" width="16" height="52" rx="7" fill="#c9a26b"/>
    <!-- frame and mattress -->
    <rect x="30" y="106" width="100" height="12" rx="2" fill="#c9a26b"/>
    <rect x="30" y="88" width="100" height="18" rx="4" fill="#fff"/>
    <!-- pillow -->
    <path d="M36 88 Q34 74 50 74 H60 Q72 74 70 88 Z" fill="#fff"/>
    <!-- blanket -->
    <path d="M66 86 Q66 80 72 80 H126 Q131 80 131 86 V112 H66 Z" fill="#d9534a"/>
    <path d="M66 92 H131" fill="none" stroke="#fff" stroke-width="2.5" opacity=".8"/>
  </g>
</svg>
