<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="hotel">
  <!-- ホテル (hotel): a tall building with a red bed sign on the roof and an awning over the door -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="139" rx="56" ry="5" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- building -->
    <rect x="38" y="48" width="84" height="90" rx="3" fill="#c9a26b"/>
    <rect x="34" y="44" width="92" height="8" rx="3" fill="#9a958b"/>
    <!-- windows -->
    <g fill="#e3eaf6">
      <rect x="47" y="60" width="16" height="12" rx="2"/>
      <rect x="72" y="60" width="16" height="12" rx="2"/>
      <rect x="97" y="60" width="16" height="12" rx="2"/>
      <rect x="47" y="80" width="16" height="12" rx="2"/>
      <rect x="72" y="80" width="16" height="12" rx="2"/>
      <rect x="97" y="80" width="16" height="12" rx="2"/>
      <rect x="47" y="100" width="16" height="12" rx="2"/>
      <rect x="97" y="100" width="16" height="12" rx="2"/>
    </g>
    <!-- door and awning -->
    <rect x="68" y="114" width="24" height="24" fill="#e3eaf6"/>
    <path d="M80 114 V138" fill="none"/>
    <path d="M62 116 L66 104 H94 L98 116 Z" fill="#3b5ba5"/>
    <!-- sign with a bed on the roof -->
    <path d="M60 44 V40 M100 44 V40" fill="none"/>
    <rect x="46" y="12" width="68" height="30" rx="7" fill="#d9534a"/>
    <g fill="#fff">
      <rect x="56" y="18" width="5" height="18" rx="1.5"/>
      <rect x="56" y="29" width="48" height="6" rx="1.5"/>
      <circle cx="68" cy="24" r="4.5"/>
      <rect x="75" y="20" width="29" height="10" rx="3"/>
    </g>
  </g>
</svg>
