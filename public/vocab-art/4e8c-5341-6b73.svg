<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="twenty years old">
  <!-- 二十歳 (twenty years old): a young man, now dressed as a grown-up in a suit, cheering behind his birthday cake, with a party hat and confetti -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="80" cy="80" r="54" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- confetti -->
    <rect x="20" y="36" width="6" height="10" rx="1" fill="#d9534a" stroke-width="2" transform="rotate(-25 23 41)"/>
    <rect x="134" y="30" width="6" height="10" rx="1" fill="#3b5ba5" stroke-width="2" transform="rotate(30 137 35)"/>
    <circle cx="28" cy="76" r="3.5" fill="#f2c14e" stroke-width="2"/>
    <circle cx="134" cy="72" r="3.5" fill="#4f8a5b" stroke-width="2"/>
    <rect x="128" y="96" width="6" height="10" rx="1" fill="#f2c14e" stroke-width="2" transform="rotate(-20 131 101)"/>
    <rect x="24" y="100" width="6" height="10" rx="1" fill="#4f8a5b" stroke-width="2" transform="rotate(25 27 105)"/>
    <!-- young man cheering -->
    <g transform="translate(80 156)">
      <path d="M-16 -76 L-35 -106 M16 -76 L35 -106" stroke-width="12"/>
      <path d="M-16 -76 L-35 -106 M16 -76 L35 -106" stroke="#3d3a4a" stroke-width="7"/>
      <circle cx="-37" cy="-109" r="5.5" fill="#f6d3b3"/>
      <circle cx="37" cy="-109" r="5.5" fill="#f6d3b3"/>
      <path d="M-20 -38 V-70 Q-20 -81 -9 -81 H9 Q20 -81 20 -70 V-38 Z" fill="#3d3a4a"/>
      <path d="M-8 -81 L0 -64 L8 -81 Z" fill="#fff"/>
      <path d="M0 -78 L-3 -71 L0 -62 L3 -71 Z" fill="#d9534a" stroke-width="1.6"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-18 -103 Q-19 -124 0 -124 Q20 -124 18 -102 Q14 -111 4 -112 Q-2 -108 -8 -111 Q-14 -109 -18 -103 Z" fill="#2b2622"/>
      <!-- party hat -->
      <path d="M-10 -119 L0 -142 L10 -119 Z" fill="#f2c14e"/>
      <path d="M-5 -130 L5 -128" fill="none" stroke="#d9534a" stroke-width="2.5"/>
      <circle cx="0" cy="-144" r="3.5" fill="#d9534a" stroke-width="2"/>
      <circle cx="-6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-7 -93 Q0 -84 7 -93 Z" fill="#fff"/>
    </g>
    <!-- birthday cake -->
    <ellipse cx="80" cy="139" rx="42" ry="5" fill="#fff"/>
    <path d="M70 72 Q76 79 70 83 Q64 79 70 72 Z M90 72 Q96 79 90 83 Q84 79 90 72 Z" fill="#f2c14e" stroke-width="2"/>
    <rect x="67" y="84" width="6" height="20" rx="1.5" fill="#3b5ba5"/>
    <rect x="87" y="84" width="6" height="20" rx="1.5" fill="#d9534a"/>
    <rect x="48" y="103" width="64" height="35" rx="5" fill="#fff"/>
    <path d="M50 121 H110" fill="none" stroke="#d9534a" stroke-width="4"/>
    <circle cx="56" cy="103" r="5" fill="#d9534a"/>
    <circle cx="80" cy="103" r="5" fill="#d9534a"/>
    <circle cx="104" cy="103" r="5" fill="#d9534a"/>
  </g>
</svg>
