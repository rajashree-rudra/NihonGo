  <circle cx="80" cy="80" r="54" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="rotate(38 80 82)">
    <!-- handle -->
    <path d="M75 70 Q77 92 74 118 Q72 140 80 142 Q88 140 86 118 Q83 92 85 70 Z" fill="#9aa3b0"/>
    <path d="M78 124 Q78 134 80 136" fill="none" stroke="#fff" stroke-width="2.5"/>
