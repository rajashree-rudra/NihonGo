    <ellipse cx="80" cy="44" rx="20" ry="28" fill="#9aa3b0"/>
    <ellipse cx="80" cy="46" rx="13" ry="20" fill="#d8d3ca" stroke-width="2"/>
    <path d="M74 34 Q75 28 79 26" fill="none" stroke="#fff" stroke-width="3"/>
  </g>
</svg>
