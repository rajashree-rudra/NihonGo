<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="ear">
  <!-- 耳 (ear): a big smiling face with one ear glowing, and a red arrow pointing at it -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="72" cy="80" r="58" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- neck and shoulders -->
    <rect x="63" y="100" width="18" height="26" fill="#f6d3b3"/>
    <path d="M22 162 Q22 132 48 126 Q60 123 72 123 Q84 123 96 126 Q122 132 122 162 Z" fill="#4f8a5b"/>
    <path d="M62 124 L72 134 L82 124" fill="none" stroke="#fff"/>
    <!-- face (the same person, close up) -->
    <g transform="translate(72 76) scale(2.1)" stroke-width="1.2">
      <!-- glow around the ear -->
      <circle cx="19.5" cy="2" r="10" fill="#f2c14e" opacity=".6" stroke="none"/>
      <circle cx="-18" cy="2" r="4.5" fill="#f6d3b3"/>
      <path d="M16 -4 Q25 -6 25 2 Q25 9 16 8 Z" fill="#f6d3b3"/>
      <path d="M19 -1 Q22 -1 22 2 Q22 5 19 5" fill="none"/>
      <circle r="18" fill="#f6d3b3"/>
      <path d="M-18 -1 Q-19 -22 0 -22 Q20 -22 18 0 Q14 -9 4 -10 Q-2 -6 -8 -9 Q-14 -7 -18 -1 Z" fill="#2b2622"/>
      <circle cx="-6" cy="2" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="2" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10.5" cy="8" r="2.6" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10.5" cy="8" r="2.6" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-1.2 7 Q0 8.1 1.2 7" fill="none"/>
      <path d="M-4.5 11 Q0 14.5 4.5 11" fill="none"/>
    </g>
    <!-- arrow pointing at the ear -->
    <path d="M0 0 L-11 -10 V-4.5 H-24 V4.5 H-11 V10 Z" fill="#d9534a" transform="translate(127 80) rotate(180)"/>
  </g>
</svg>
