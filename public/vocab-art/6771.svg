<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="east">
  <!-- 東 (east): a compass rose with north up; the red point shows east (right) -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- compass case and face -->
    <circle cx="80" cy="80" r="58" fill="#f2c14e"/>
    <circle cx="80" cy="80" r="48" fill="#fff"/>
    <g fill="#2b2622" stroke="none">
      <circle cx="80" cy="27" r="2.2"/>
      <circle cx="80" cy="133" r="2.2"/>
      <circle cx="27" cy="80" r="2.2"/>
    </g>
    <g transform="translate(80 80)">
      <!-- small diagonal points -->
      <g fill="#d8d3ca">
        <path d="M0 0 L-5 -5 L0 -28 L5 -5 Z" transform="rotate(45)"/>
        <path d="M0 0 L-5 -5 L0 -28 L5 -5 Z" transform="rotate(135)"/>
        <path d="M0 0 L-5 -5 L0 -28 L5 -5 Z" transform="rotate(225)"/>
        <path d="M0 0 L-5 -5 L0 -28 L5 -5 Z" transform="rotate(315)"/>
      </g>
      <!-- north, south, west points (plain) -->
      <g transform="rotate(0)"><path d="M0 0 L-7 -7 L0 -38 Z" fill="#fff"/><path d="M0 0 L0 -38 L7 -7 Z" fill="#d8d3ca"/></g>
      <g transform="rotate(180)"><path d="M0 0 L-7 -7 L0 -38 Z" fill="#fff"/><path d="M0 0 L0 -38 L7 -7 Z" fill="#d8d3ca"/></g>
      <g transform="rotate(270)"><path d="M0 0 L-7 -7 L0 -38 Z" fill="#fff"/><path d="M0 0 L0 -38 L7 -7 Z" fill="#d8d3ca"/></g>
      <!-- east point highlighted -->
      <g transform="rotate(90)"><path d="M0 0 L-12 -9 L0 -46 Z" fill="#d9534a"/><path d="M0 0 L0 -46 L12 -9 Z" fill="#d9534a"/><path d="M0 -6 V-40" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/></g>
      <circle r="5" fill="#9aa3b0"/>
    </g>
    <circle cx="133" cy="80" r="4" fill="#d9534a" stroke-width="1.8"/>
  </g>
</svg>
