<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="road, street">
  <!-- 道 (road): a road with a dashed centre line running into the distance between green hills -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="50" r="40" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- hills on the horizon -->
    <path d="M14 62 Q36 36 60 54 Q84 32 108 52 Q128 38 146 62 Z" fill="#4f8a5b"/>
    <!-- road -->
    <path d="M28 142 L74 60 H86 L132 142 Z" fill="#9a958b"/>
    <g fill="none" stroke="#fff">
      <path d="M80 138 V122" stroke-width="5"/>
      <path d="M80 110 V98" stroke-width="4"/>
      <path d="M80 89 V81" stroke-width="3"/>
      <path d="M80 74 V69" stroke-width="2.5"/>
      <path d="M80 65 V63" stroke-width="2"/>
    </g>
    <!-- trees by the road -->
    <rect x="31" y="96" width="5" height="16" fill="#c9a26b"/>
    <circle cx="33.5" cy="88" r="11" fill="#4f8a5b"/>
    <rect x="124" y="88" width="5" height="14" fill="#c9a26b"/>
    <circle cx="126.5" cy="81" r="9.5" fill="#4f8a5b"/>
  </g>
</svg>
