<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="medicine">
  <!-- 薬 (medicine): a medicine bottle with a red cross label, next to two capsules and a round tablet -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="82" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="134" rx="58" ry="6" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- bottle -->
    <rect x="46" y="38" width="38" height="16" rx="4" fill="#fff"/>
    <path d="M49 46 H81" fill="none" opacity=".35"/>
    <path d="M40 66 Q40 54 52 54 H78 Q90 54 90 66 V124 Q90 132 82 132 H48 Q40 132 40 124 Z" fill="#c9a26b"/>
    <rect x="46" y="72" width="38" height="40" rx="4" fill="#fff"/>
    <path d="M61 81 H69 V88 H76 V96 H69 V103 H61 V96 H54 V88 H61 Z" fill="#d9534a" stroke-width="2"/>
    <path d="M45 62 V70" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
    <!-- capsules -->
    <g transform="translate(114 100) rotate(-35)">
      <path d="M0 -8 H-12 Q-20 -8 -20 0 Q-20 8 -12 8 H0 Z" fill="#d9534a"/>
      <path d="M0 -8 H12 Q20 -8 20 0 Q20 8 12 8 H0 Z" fill="#fff"/>
    </g>
    <g transform="translate(126 126) rotate(10)">
      <path d="M0 -7 H-11 Q-18 -7 -18 0 Q-18 7 -11 7 H0 Z" fill="#f2c14e"/>
      <path d="M0 -7 H11 Q18 -7 18 0 Q18 7 11 7 H0 Z" fill="#fff"/>
    </g>
    <!-- tablet -->
    <ellipse cx="104" cy="126" rx="9" ry="6" fill="#fff"/>
    <path d="M98 126 H110" fill="none" stroke-width="1.8"/>
  </g>
</svg>
