<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="plate, dish">
  <!-- お皿 (plate, dish): a clean white plate with a blue rim, seen from slightly above, sparkling -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="86" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="126" rx="56" ry="7" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- plate thickness -->
    <ellipse cx="80" cy="98" rx="60" ry="26" fill="#d8d3ca"/>
    <!-- plate top -->
    <ellipse cx="80" cy="92" rx="60" ry="26" fill="#fff"/>
    <ellipse cx="80" cy="92" rx="52" ry="21.5" fill="none" stroke="#3b5ba5" stroke-width="3.5"/>
    <ellipse cx="80" cy="93" rx="36" ry="13" fill="#efe6dc"/>
    <path d="M58 89 Q66 84 76 83" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- sparkles -->
    <path d="M122 40 L125 49 L134 52 L125 55 L122 64 L119 55 L110 52 L119 49 Z" fill="#f2c14e"/>
    <path d="M38 50 L40 56 L46 58 L40 60 L38 66 L36 60 L30 58 L36 56 Z" fill="#f2c14e" stroke-width="2"/>
  </g>
</svg>
