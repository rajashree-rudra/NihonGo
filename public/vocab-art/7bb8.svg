<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="chopsticks">
  <!-- 箸 (chopsticks): a pair of wooden chopsticks with red tops, their tips resting on a little chopstick rest -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="80" r="56" fill="#fff" opacity=".55"/>
  <!-- soft shadow of the chopsticks -->
  <g fill="#c5e2cf">
    <path d="M131 34 L137 41 L41 128 L38 125 Z"/>
    <path d="M139 43 L144 49 L48 134 L45 131 Z"/>
  </g>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- chopstick rest -->
    <ellipse cx="60" cy="100" rx="17" ry="7" fill="#9cc27a" transform="rotate(47 60 100)"/>
    <!-- chopsticks -->
    <path d="M125.3 27.1 L130.7 32.9 L35.2 119.3 L32.8 116.7 Z" fill="#c9a26b"/>
    <path d="M125.3 27.1 L130.7 32.9 L111.4 50.4 L106.6 45.2 Z" fill="#d9534a"/>
    <path d="M132.8 35 L138.2 41 L41.2 125.3 L38.8 122.7 Z" fill="#c9a26b"/>
    <path d="M132.8 35 L138.2 41 L118.6 58 L113.8 52.8 Z" fill="#d9534a"/>
  </g>
</svg>
