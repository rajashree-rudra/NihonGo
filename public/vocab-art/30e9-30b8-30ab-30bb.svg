<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="radio-cassette player, boombox">
  <!-- ラジカセ (boombox): a radio-cassette player with two big speakers, a cassette in the middle, an antenna and music -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="80" cy="90" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="134" rx="64" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- music notes -->
    <path d="M30 30 V16 L42 13 V27" fill="none" stroke-width="2.5"/>
    <ellipse cx="27.5" cy="30.5" rx="3.6" ry="2.8" fill="#2b2622"/>
    <ellipse cx="39.5" cy="27.5" rx="3.6" ry="2.8" fill="#2b2622"/>
    <path d="M58 32 V20 Q62 24 66 24" fill="none" stroke-width="2.5"/>
    <ellipse cx="55.5" cy="32.5" rx="3.6" ry="2.8" fill="#2b2622"/>
    <!-- antenna -->
    <path d="M122 56 L140 18" fill="none" stroke="#9aa3b0" stroke-width="5"/>
    <path d="M122 56 L140 18" fill="none" stroke-width="1.2" opacity=".6"/>
    <circle cx="141" cy="16" r="4" fill="#9aa3b0"/>
    <!-- handle -->
    <path d="M38 58 V46 Q38 38 46 38 H114 Q122 38 122 46 V58" fill="none" stroke-width="7"/>
    <!-- body -->
    <rect x="12" y="54" width="136" height="76" rx="12" fill="#9aa3b0"/>
    <!-- speakers -->
    <circle cx="40" cy="96" r="23" fill="#3d3a4a"/>
    <circle cx="40" cy="96" r="11" fill="#6f6a60"/>
    <circle cx="40" cy="96" r="4" fill="#2b2622"/>
    <circle cx="120" cy="96" r="23" fill="#3d3a4a"/>
    <circle cx="120" cy="96" r="11" fill="#6f6a60"/>
    <circle cx="120" cy="96" r="4" fill="#2b2622"/>
    <!-- buttons -->
    <rect x="66" y="62" width="7" height="8" rx="1.5" fill="#d9534a" stroke-width="1.8"/>
    <rect x="76.5" y="62" width="7" height="8" rx="1.5" fill="#efe6dc" stroke-width="1.8"/>
    <rect x="87" y="62" width="7" height="8" rx="1.5" fill="#efe6dc" stroke-width="1.8"/>
    <!-- cassette deck with a cassette -->
    <rect x="64" y="76" width="32" height="44" rx="4" fill="#3d3a4a"/>
    <g transform="translate(80 98)">
      <rect x="-13" y="-17" width="26" height="34" rx="2.5" fill="#fff" stroke-width="2"/>
      <rect x="-9" y="-12" width="18" height="22" rx="2" fill="#f2c14e" stroke-width="1.6"/>
      <circle cx="0" cy="-5" r="3.2" fill="#fff" stroke-width="1.6"/>
      <circle cx="0" cy="5" r="3.2" fill="#fff" stroke-width="1.6"/>
    </g>
  </g>
</svg>
