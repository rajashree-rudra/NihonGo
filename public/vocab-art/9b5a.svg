<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="fish">
  <!-- 魚 (fish): a whole fresh fish lying on a plate -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="137" rx="58" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- plate -->
    <ellipse cx="80" cy="112" rx="64" ry="22" fill="#fff"/>
    <ellipse cx="80" cy="112" rx="50" ry="15" fill="none" opacity=".25"/>
    <!-- fins and tail -->
    <path d="M60 76 Q72 58 92 74 Z" fill="#3b5ba5"/>
    <path d="M70 110 Q78 122 88 110 Z" fill="#3b5ba5"/>
    <path d="M116 92 L142 74 Q136 92 142 110 Z" fill="#3b5ba5"/>
    <!-- body: blue back, pale belly -->
    <path d="M20 92 Q40 66 82 72 Q108 76 122 92 Q108 108 82 112 Q40 118 20 92 Z" fill="#7f9cc8"/>
    <path d="M24 96 Q50 100 80 98 Q104 96 120 93 Q106 108 82 112 Q42 118 24 96 Z" fill="#d6e2f2" stroke="none"/>
    <path d="M20 92 Q40 66 82 72 Q108 76 122 92 Q108 108 82 112 Q40 118 20 92 Z" fill="none"/>
    <path d="M44 78 Q52 92 44 106" fill="none"/>
    <path d="M62 86 Q66 90 62 94 M74 84 Q78 88 74 92 M86 86 Q90 90 86 94 M98 86 Q102 90 98 94" fill="none" stroke-width="2" opacity=".45"/>
    <!-- eye -->
    <circle cx="33" cy="88" r="5" fill="#fff"/>
    <circle cx="33" cy="88" r="2.3" fill="#2b2622" stroke="none"/>
  </g>
</svg>
