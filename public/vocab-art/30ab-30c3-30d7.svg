<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="cup">
  <!-- カップ (cup): a coffee cup with a handle on a saucer, steam rising -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="80" cy="88" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="136" rx="52" ry="6" fill="#f1cfc7"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- steam -->
    <path d="M66 52 Q60 44 66 36 Q72 28 66 20" fill="none" stroke="#9a958b" stroke-width="3.5"/>
    <path d="M82 50 Q76 42 82 34 Q88 26 82 18" fill="none" stroke="#9a958b" stroke-width="3.5"/>
    <!-- saucer -->
    <ellipse cx="80" cy="128" rx="48" ry="9" fill="#d8d3ca"/>
    <ellipse cx="80" cy="125" rx="48" ry="9" fill="#fff"/>
    <!-- handle -->
    <path d="M106 80 Q126 78 124 96 Q122 112 102 110" fill="none" stroke="#2b2622" stroke-width="12"/>
    <path d="M106 80 Q126 78 124 96 Q122 112 102 110" fill="none" stroke="#fff" stroke-width="7"/>
    <!-- cup body -->
    <path d="M46 66 H114 L108 112 Q106 124 94 124 H66 Q54 124 52 112 Z" fill="#fff"/>
    <path d="M47.6 79 H112.3 L111 89 H49 Z" fill="#d9534a" stroke="none"/>
    <path d="M47.6 79 H112.3 M49 89 H111" fill="none"/>
    <!-- coffee -->
    <ellipse cx="80" cy="66" rx="34" ry="7" fill="#fff"/>
    <ellipse cx="80" cy="67" rx="29" ry="4.5" fill="#5a4636"/>
  </g>
</svg>
