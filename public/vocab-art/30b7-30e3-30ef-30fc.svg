<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="shower">
  <!-- シャワー (shower): a shower head on a wall pipe with water streaming down -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="86" cy="84" r="54" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- pipe -->
    <path d="M38 142 V42 Q38 30 50 30 H90" fill="none" stroke="#2b2622" stroke-width="11"/>
    <path d="M38 142 V42 Q38 30 50 30 H90" fill="none" stroke="#9aa3b0" stroke-width="6"/>
    <!-- tap -->
    <circle cx="38" cy="100" r="8" fill="#d9534a"/>
    <!-- water streams -->
    <g fill="none" stroke="#3b5ba5" stroke-width="3.5" stroke-dasharray="12 9">
      <path d="M80 58 L66 128"/>
      <path d="M90 58 L86 134"/>
      <path d="M102 58 L106 134"/>
      <path d="M112 58 L126 128"/>
    </g>
    <g fill="#3b5ba5" stroke-width="2">
      <path d="M70 134 Q75 141 70 144 Q65 141 70 134 Z"/>
      <path d="M96 136 Q101 143 96 146 Q91 143 96 136 Z"/>
      <path d="M122 134 Q127 141 122 144 Q117 141 122 134 Z"/>
    </g>
    <!-- shower head -->
    <rect x="88" y="22" width="12" height="12" rx="2" fill="#9aa3b0"/>
    <path d="M86 32 H102 L122 52 H66 Z" fill="#9aa3b0"/>
    <ellipse cx="94" cy="53" rx="28" ry="5" fill="#d8d3ca"/>
    <g fill="#2b2622" stroke="none">
      <circle cx="80" cy="53" r="1.6"/><circle cx="89" cy="54" r="1.6"/><circle cx="99" cy="54" r="1.6"/><circle cx="108" cy="53" r="1.6"/>
    </g>
  </g>
</svg>
