<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="outside">
  <!-- 外 (outside): a cosy house with a lit window; a person stands outside it in the rain with an umbrella -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <ellipse cx="80" cy="141" rx="64" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- house (inside is dry and warm) -->
    <rect x="16" y="80" width="60" height="58" fill="#efe6dc"/>
    <path d="M8 84 L46 46 L84 84 Z" fill="#9a958b"/>
    <rect x="23" y="92" width="22" height="20" rx="2" fill="#f2c14e"/>
    <path d="M34 92 V112 M23 102 H45" fill="none" stroke-width="2"/>
    <rect x="54" y="104" width="15" height="34" rx="2" fill="#c9a26b"/>
    <!-- rain -->
    <g fill="#3b5ba5" stroke="none">
      <path d="M24 22 q4 6 0 9 q-4 -3 0 -9z"/>
      <path d="M46 14 q4 6 0 9 q-4 -3 0 -9z"/>
      <path d="M68 26 q4 6 0 9 q-4 -3 0 -9z"/>
      <path d="M88 48 q4 6 0 9 q-4 -3 0 -9z"/>
      <path d="M90 78 q4 6 0 9 q-4 -3 0 -9z"/>
      <path d="M86 110 q4 6 0 9 q-4 -3 0 -9z"/>
      <path d="M150 62 q4 6 0 9 q-4 -3 0 -9z"/>
      <path d="M146 94 q4 6 0 9 q-4 -3 0 -9z"/>
      <path d="M92 16 q4 6 0 9 q-4 -3 0 -9z"/>
      <path d="M10 50 q4 6 0 9 q-4 -3 0 -9z"/>
    </g>
    <!-- puddle -->
    <ellipse cx="114" cy="140" rx="24" ry="4" fill="#9aa3b0" opacity=".6" stroke="none"/>
    <!-- person outside -->
    <g transform="translate(112 140) scale(.75)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-13" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="3" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="-28" y="-78" width="10" height="36" rx="5" fill="#4f8a5b"/>
      <circle cx="-23" cy="-40" r="5.5" fill="#f6d3b3"/>
      <path d="M-20 -38 V-70 Q-20 -81 -9 -81 H9 Q20 -81 20 -70 V-38 Z" fill="#4f8a5b"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-18 -103 Q-19 -124 0 -124 Q20 -124 18 -102 Q14 -111 4 -112 Q-2 -108 -8 -111 Q-14 -109 -18 -103 Z" fill="#5a4636"/>
      <circle cx="-6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-6 -93 Q0 -87 6 -93" fill="none"/>
      <!-- raised arm -->
      <path d="M15 -74 L24 -86" stroke="#2b2622" stroke-width="12"/>
      <path d="M15 -74 L24 -86" stroke="#4f8a5b" stroke-width="7"/>
    </g>
    <!-- umbrella -->
    <g transform="translate(118 22) rotate(-13)">
      <path d="M0 20 V55" fill="none" stroke-width="3"/>
      <path d="M0 -4 V-9" fill="none" stroke-width="3"/>
      <path d="M-29 20 Q-29 -4 0 -4 Q29 -4 29 20 Q22 15 14.5 20 Q7 15 0 20 Q-7 15 -14.5 20 Q-22 15 -29 20 Z" fill="#d9534a"/>
      <path d="M0 -4 Q-8 6 -14.5 20 M0 -4 Q8 6 14.5 20" fill="none" stroke-width="2"/>
    </g>
    <circle cx="130" cy="75" r="4.2" fill="#f6d3b3"/>
  </g>
</svg>
