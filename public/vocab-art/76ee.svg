<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="eye(s)">
  <!-- 目 (eyes): a big smiling face with large sparkling eyes, and a red arrow pointing at them -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="80" r="58" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- neck and shoulders -->
    <rect x="71" y="100" width="18" height="26" fill="#f6d3b3"/>
    <path d="M30 162 Q30 132 56 126 Q68 123 80 123 Q92 123 104 126 Q130 132 130 162 Z" fill="#3b5ba5"/>
    <path d="M70 124 L80 134 L90 124" fill="none" stroke="#fff"/>
    <!-- face (the same person, close up) -->
    <g transform="translate(80 76) scale(2.1)" stroke-width="1.2">
      <circle cx="-18" cy="2" r="4.5" fill="#f6d3b3"/>
      <circle cx="18" cy="2" r="4.5" fill="#f6d3b3"/>
      <circle r="18" fill="#f6d3b3"/>
      <path d="M-18 -1 Q-19 -22 0 -22 Q20 -22 18 0 Q14 -9 4 -10 Q-2 -6 -8 -9 Q-14 -7 -18 -1 Z" fill="#2b2622"/>
      <!-- big shining eyes -->
      <ellipse cx="-6.5" cy="2" rx="3.4" ry="4.4" fill="#2b2622" stroke="none"/>
      <circle cx="-5.3" cy=".4" r="1.4" fill="#fff" stroke="none"/>
      <circle cx="-7.6" cy="4" r=".7" fill="#fff" stroke="none"/>
      <ellipse cx="6.5" cy="2" rx="3.4" ry="4.4" fill="#2b2622" stroke="none"/>
      <circle cx="7.7" cy=".4" r="1.4" fill="#fff" stroke="none"/>
      <circle cx="5.4" cy="4" r=".7" fill="#fff" stroke="none"/>
      <circle cx="-11.5" cy="9" r="2.6" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="11.5" cy="9" r="2.6" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-1.2 9 Q0 10.1 1.2 9" fill="none"/>
      <path d="M-4.5 12.5 Q0 16 4.5 12.5" fill="none"/>
    </g>
    <!-- arrow pointing at the eyes -->
    <path d="M0 0 L-12 -10 V-4.5 H-26 V4.5 H-12 V10 Z" fill="#d9534a" transform="translate(60 72) rotate(40)"/>
  </g>
</svg>
