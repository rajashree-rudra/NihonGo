<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="a cold (illness)">
  <!-- 風邪 (a cold): a shivering person in a scarf sneezing into a tissue, with sneeze drops flying -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="70" cy="88" r="52" fill="#fff" opacity=".55"/>
  <ellipse cx="70" cy="143" rx="38" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(66 142)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-13" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="3" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="-28" y="-78" width="10" height="36" rx="5" fill="#4f8a5b"/>
      <circle cx="-23" cy="-40" r="5.5" fill="#f6d3b3"/>
      <!-- arm up holding the tissue -->
      <path d="M15 -74 L32 -66 L16 -88" fill="none" stroke-width="12"/>
      <path d="M15 -74 L32 -66 L16 -88" fill="none" stroke="#4f8a5b" stroke-width="7"/>
      <path d="M-20 -38 V-70 Q-20 -81 -9 -81 H9 Q20 -81 20 -70 V-38 Z" fill="#4f8a5b"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-18 -103 Q-19 -124 0 -124 Q20 -124 18 -102 Q14 -111 4 -112 Q-2 -108 -8 -111 Q-14 -109 -18 -103 Z" fill="#2b2622"/>
      <!-- eyes squeezed shut -->
      <path d="M-11 -106 L-5 -103 L-11 -100 M11 -106 L5 -103 L11 -100" fill="none" stroke-width="2.2"/>
      <circle cx="-12" cy="-95" r="3.5" fill="#d9534a" stroke="none" opacity=".45"/>
      <!-- scarf -->
      <path d="M-14 -86 Q0 -80 14 -86 L16 -78 Q0 -72 -16 -78 Z" fill="#d9534a"/>
      <path d="M-12 -79 L-16 -58 H-7 L-5 -78" fill="#d9534a"/>
      <path d="M-15 -64 H-7" fill="none" stroke="#fff" stroke-width="2"/>
      <!-- tissue at the nose -->
      <path d="M-3 -100 Q4 -103 12 -100 L13 -88 Q5 -86 -2 -88 Z" fill="#fff"/>
      <path d="M3 -98 L5 -92" fill="none" stroke-width="1.6" opacity=".4"/>
      <circle cx="16" cy="-89" r="5.5" fill="#f6d3b3"/>
    </g>
    <!-- sneeze drops -->
    <path d="M90 42 L98 38 M92 50 L102 50 M90 58 L98 62" fill="none" stroke-width="2.2"/>
    <circle cx="106" cy="34" r="3.5" fill="#c7d3ea"/>
    <circle cx="111" cy="49" r="4" fill="#c7d3ea"/>
    <circle cx="106" cy="64" r="3" fill="#c7d3ea"/>
    <circle cx="120" cy="40" r="2.5" fill="#c7d3ea"/>
    <circle cx="121" cy="58" r="2.5" fill="#c7d3ea"/>
    <!-- shiver lines -->
    <path d="M28 84 Q24 90 28 96 Q32 102 28 108 M110 84 Q106 90 110 96 Q114 102 110 108" fill="none" stroke="#3b5ba5" stroke-width="2.5"/>
  </g>
</svg>
