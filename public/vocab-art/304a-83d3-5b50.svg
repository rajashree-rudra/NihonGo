<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="sweets, snacks">
  <!-- お菓子 (sweets, snacks): a bag of chips, a half-unwrapped chocolate bar and a chocolate-chip cookie -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="82" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="82" cy="138" rx="62" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- snack bag -->
    <path d="M62 30 H116 L118 38 Q123 80 118 124 L116 132 H62 L60 124 Q55 80 60 38 Z" fill="#f2c14e"/>
    <path d="M60 38 H118 M60 124 H118" fill="none"/>
    <path d="M68 30 V38 M76 30 V38 M84 30 V38 M92 30 V38 M100 30 V38 M108 30 V38 M68 124 V132 M76 124 V132 M84 124 V132 M92 124 V132 M100 124 V132 M108 124 V132" fill="none" stroke-width="1.6" opacity=".5"/>
    <circle cx="89" cy="78" r="21" fill="#d9534a"/>
    <ellipse cx="86" cy="80" rx="12" ry="9" fill="#f8dc8a" transform="rotate(-20 86 80)"/>
    <ellipse cx="94" cy="74" rx="10" ry="7" fill="#f8dc8a" transform="rotate(25 94 74)"/>
    <!-- chocolate bar, half unwrapped -->
    <g transform="rotate(-12 40 92)">
      <rect x="24" y="52" width="34" height="40" rx="3" fill="#5a3a26"/>
      <path d="M41 52 V92 M24 65 H58 M24 78 H58" fill="none" stroke="#8a5a3b" stroke-width="2"/>
      <path d="M22 86 L28 82 L34 88 L40 82 L46 88 L52 82 L60 86 V130 Q60 134 56 134 H26 Q22 134 22 130 Z" fill="#3b5ba5"/>
      <path d="M22 110 H60" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <!-- cookie -->
    <circle cx="120" cy="114" r="21" fill="#d9a35a"/>
    <g fill="#5a3a26" stroke="none">
      <circle cx="112" cy="106" r="3"/>
      <circle cx="126" cy="104" r="2.6"/>
      <circle cx="120" cy="118" r="3"/>
      <circle cx="110" cy="122" r="2.4"/>
      <circle cx="131" cy="118" r="2.6"/>
    </g>
  </g>
</svg>
