<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="international student">
  <!-- 留学生 (international student): the blond visitor from 外国人, now a student with a backpack and books, a plane flying in from abroad -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="90" cy="86" r="52" fill="#fff" opacity=".55"/>
  <ellipse cx="90" cy="141" rx="44" ry="6" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- plane -->
    <path d="M10 56 Q18 52 24 46" fill="none" stroke="#9a958b" stroke-dasharray="3 5"/>
    <g transform="translate(40 34) rotate(-18)">
      <path d="M-13 0 L-19 -11 H-13 L-6 -2 Z" fill="#d9534a"/>
      <path d="M-19 0 Q-19 -5 -13 -5 H11 Q21 -5 21 0 Q21 5 11 5 H-13 Q-19 5 -19 0 Z" fill="#fff"/>
      <path d="M-2 2 L-9 13 H-2 L7 2 Z" fill="#9aa3b0"/>
      <circle cx="-4" cy="-1" r="1.3" fill="#3b5ba5" stroke="none"/>
      <circle cx="2" cy="-1" r="1.3" fill="#3b5ba5" stroke="none"/>
      <circle cx="8" cy="-1" r="1.3" fill="#3b5ba5" stroke="none"/>
    </g>
    <!-- student -->
    <g transform="translate(90 140)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-13" y="-40" width="10" height="37" rx="4" fill="#3b5ba5"/>
      <rect x="3" y="-40" width="10" height="37" rx="4" fill="#3b5ba5"/>
      <!-- backpack behind -->
      <rect x="-26" y="-84" width="52" height="42" rx="10" fill="#4f8a5b"/>
      <rect x="18" y="-78" width="10" height="36" rx="5" fill="#d9534a"/>
      <circle cx="23" cy="-40" r="5.5" fill="#f6d3b3"/>
      <path d="M-20 -38 V-70 Q-20 -81 -9 -81 H9 Q20 -81 20 -70 V-38 Z" fill="#d9534a"/>
      <path d="M-7 -81 L0 -72 L7 -81 Z" fill="#fff"/>
      <!-- backpack straps -->
      <path d="M-13 -81 Q-15 -62 -13 -46 M13 -81 Q15 -62 13 -46" fill="none" stroke-width="7"/>
      <path d="M-13 -81 Q-15 -62 -13 -46 M13 -81 Q15 -62 13 -46" fill="none" stroke="#4f8a5b" stroke-width="3"/>
      <!-- books held at the side -->
      <rect x="-28" y="-78" width="10" height="30" rx="5" fill="#d9534a"/>
      <rect x="-36" y="-58" width="12" height="24" rx="1.5" fill="#3b5ba5"/>
      <rect x="-24" y="-56" width="5" height="22" fill="#f2c14e" stroke-width="2"/>
      <circle cx="-23" cy="-50" r="5.5" fill="#f6d3b3"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-19 -100 Q-21 -126 2 -125 Q22 -123 19 -100 Q17 -112 8 -112 Q-2 -117 -12 -108 Q-16 -106 -19 -100 Z" fill="#f2c14e"/>
      <circle cx="-6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-6 -93 Q0 -87 6 -93" fill="none"/>
    </g>
  </g>
</svg>
