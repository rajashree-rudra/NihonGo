<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="bath">
  <!-- お風呂 (bath): a relaxed person soaking in a wooden Japanese bathtub, towel on head, steam rising -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="76" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="140" rx="60" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- steam -->
    <path d="M32 62 Q26 54 32 46 Q38 38 32 30 M128 62 Q122 54 128 46 Q134 38 128 30" fill="none" stroke="#9a958b" stroke-width="3.5"/>
    <!-- person (bare shoulders, eyes happily closed) -->
    <g transform="translate(80 152)">
      <path d="M-24 -62 V-70 Q-24 -81 -11 -81 H11 Q24 -81 24 -70 V-62 Z" fill="#f6d3b3"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-18 -103 Q-19 -122 0 -122 Q20 -122 18 -102 Q14 -111 4 -112 Q-2 -108 -8 -111 Q-14 -109 -18 -103 Z" fill="#2b2622"/>
      <!-- folded towel on the head -->
      <rect x="-13" y="-129" width="26" height="9" rx="3" fill="#fff"/>
      <path d="M-13 -125 H13" fill="none" stroke="#3b5ba5" stroke-width="2"/>
      <path d="M-9 -100 Q-6 -103 -3 -100 M3 -100 Q6 -103 9 -100" fill="none"/>
      <circle cx="-10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-6 -93 Q0 -87 6 -93" fill="none"/>
    </g>
    <!-- water -->
    <rect x="26" y="74" width="108" height="10" fill="#3b5ba5" fill-opacity=".45" stroke="none"/>
    <path d="M26 74 Q36 71 46 74 M114 74 Q124 71 134 74" fill="none" stroke="#3b5ba5" stroke-width="2"/>
    <!-- wooden tub -->
    <rect x="26" y="88" width="108" height="50" rx="3" fill="#c9a26b"/>
    <path d="M44 90 V136 M62 90 V136 M80 90 V136 M98 90 V136 M116 90 V136" fill="none" stroke-width="1.8" opacity=".45"/>
    <rect x="24" y="98" width="112" height="6" rx="2" fill="#9aa3b0"/>
    <rect x="24" y="122" width="112" height="6" rx="2" fill="#9aa3b0"/>
    <rect x="20" y="80" width="120" height="9" rx="3" fill="#c9a26b"/>
    <!-- arms resting on the rim -->
    <path d="M62 78 L40 82" stroke="#2b2622" stroke-width="12"/>
    <path d="M62 78 L40 82" stroke="#f6d3b3" stroke-width="7"/>
    <path d="M98 78 L120 82" stroke="#2b2622" stroke-width="12"/>
    <path d="M98 78 L120 82" stroke="#f6d3b3" stroke-width="7"/>
  </g>
</svg>
