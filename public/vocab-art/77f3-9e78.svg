<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="soap">
  <!-- 石鹸 (soap): a pink bar of soap with foam and bubbles floating up -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="128" rx="54" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- soap bar -->
    <rect x="28" y="88" width="104" height="36" rx="16" fill="#f4a3a0"/>
    <rect x="28" y="78" width="104" height="34" rx="16" fill="#fbe6e1"/>
    <rect x="50" y="87" width="60" height="16" rx="8" fill="none" stroke-width="2" opacity=".45"/>
    <!-- foam on the bar -->
    <path d="M86 82 Q84 72 93 71 Q96 63 105 67 Q113 62 117 70 Q126 71 124 80 Q126 86 118 86 H92 Q85 87 86 82 Z" fill="#fff"/>
    <!-- bubbles -->
    <g fill="#fff">
      <circle cx="54" cy="58" r="11"/>
      <circle cx="76" cy="42" r="7"/>
      <circle cx="106" cy="44" r="12"/>
      <circle cx="122" cy="22" r="6"/>
      <circle cx="44" cy="30" r="5.5"/>
      <circle cx="88" cy="22" r="4.5"/>
    </g>
    <g fill="none" stroke="#3b5ba5" stroke-width="2.2">
      <path d="M48 54 Q50 50 54 49"/>
      <path d="M100 40 Q102 36 106 35"/>
      <path d="M73 40 Q74 38 76 37.5"/>
    </g>
  </g>
</svg>
