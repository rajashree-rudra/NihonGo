<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="water">
  <!-- 水 (water): a tall glass of cold water with ice cubes, and a big water drop -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="78" cy="136" rx="46" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- glass -->
    <path d="M42 36 H114 L106 126 Q105 134 97 134 H59 Q51 134 50 126 Z" fill="#fff" fill-opacity=".7"/>
    <!-- water -->
    <path d="M44.2 60 H111.8 L106 126 Q105 134 97 134 H59 Q51 134 50 126 Z" fill="#8fbbe8"/>
    <ellipse cx="78" cy="60" rx="33.8" ry="6" fill="#c3dcf5"/>
    <!-- ice cubes -->
    <rect x="56" y="48" width="18" height="18" rx="4" fill="#fff" transform="rotate(-12 65 57)"/>
    <rect x="80" y="46" width="18" height="18" rx="4" fill="#fff" transform="rotate(14 89 55)"/>
    <!-- bubbles and shine -->
    <circle cx="72" cy="100" r="3" fill="#fff" stroke-width="1.8"/>
    <circle cx="88" cy="114" r="2.2" fill="#fff" stroke-width="1.6"/>
    <circle cx="84" cy="86" r="2" fill="#fff" stroke-width="1.6"/>
    <path d="M54 72 L58 120" fill="none" stroke="#fff" stroke-width="4" opacity=".8"/>
    <ellipse cx="78" cy="36" rx="36" ry="6" fill="none"/>
    <!-- water drop -->
    <path d="M132 22 Q122 36 122 43 A10 10 0 0 0 142 43 Q142 36 132 22 Z" fill="#3b5ba5"/>
    <path d="M127 42 Q127 38 129 36" fill="none" stroke="#fff" stroke-width="2.5"/>
  </g>
</svg>
