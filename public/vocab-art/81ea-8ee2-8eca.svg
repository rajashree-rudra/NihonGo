<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="bicycle">
  <!-- 自転車 (bicycle): a red bicycle seen from the side, with a basket on the front -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="130" rx="64" ry="5" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- wheels -->
    <g>
      <circle cx="40" cy="102" r="25" fill="#3d3a4a"/>
      <circle cx="40" cy="102" r="19" fill="#fff"/>
      <path d="M40 83 V121 M21 102 H59 M27 89 L53 115 M27 115 L53 89" fill="none" stroke="#9aa3b0" stroke-width="1.6"/>
      <circle cx="40" cy="102" r="3.5" fill="#9aa3b0"/>
      <circle cx="120" cy="102" r="25" fill="#3d3a4a"/>
      <circle cx="120" cy="102" r="19" fill="#fff"/>
      <path d="M120 83 V121 M101 102 H139 M107 89 L133 115 M107 115 L133 89" fill="none" stroke="#9aa3b0" stroke-width="1.6"/>
      <circle cx="120" cy="102" r="3.5" fill="#9aa3b0"/>
    </g>
    <!-- frame -->
    <path d="M40 102 H76 L66 64 M40 102 L68 72 H108 M76 102 L110 76 M120 102 L106 58" fill="none" stroke-width="9"/>
    <path d="M40 102 H76 L66 64 M40 102 L68 72 H108 M76 102 L110 76 M120 102 L106 58" fill="none" stroke="#d9534a" stroke-width="4.5"/>
    <!-- saddle -->
    <path d="M54 62 Q64 56 76 60 Q72 66 60 66 Q54 66 54 62 Z" fill="#3d3a4a"/>
    <!-- handlebar -->
    <path d="M106 58 Q100 50 92 52" fill="none" stroke-width="5"/>
    <rect x="86" y="48" width="9" height="7" rx="3" fill="#3d3a4a"/>
    <!-- basket -->
    <path d="M110 56 H136 L132 74 H114 Z" fill="#c9a26b"/>
    <path d="M118 57 L119 73 M126 57 L125 73 M112 65 H134" fill="none" stroke-width="1.6" opacity=".6"/>
    <!-- chainring, crank and pedal -->
    <circle cx="76" cy="102" r="7" fill="#9aa3b0"/>
    <path d="M76 102 L84 112" fill="none" stroke-width="3"/>
    <rect x="80" y="111" width="10" height="4" rx="1.5" fill="#3d3a4a"/>
  </g>
</svg>
