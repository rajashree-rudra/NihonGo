<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="restaurant">
  <!-- レストラン (restaurant): a restaurant with a crossed fork-and-knife sign, and a set table seen through the window -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="80" cy="84" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="137" rx="62" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- building -->
    <rect x="22" y="54" width="116" height="82" fill="#efe6dc"/>
    <rect x="18" y="48" width="124" height="10" rx="3" fill="#3d3a4a"/>
    <!-- big window with a table -->
    <rect x="30" y="76" width="54" height="46" rx="2" fill="#e3eaf6"/>
    <path d="M38 104 H76 L72 112 H42 Z" fill="#d9534a"/>
    <path d="M46 112 V122 M68 112 V122" fill="none"/>
    <ellipse cx="57" cy="101" rx="9" ry="3" fill="#fff"/>
    <path d="M53 96 Q51 92 54 89 M60 96 Q58 92 61 89" fill="none" stroke-width="1.8" opacity=".6"/>
    <!-- awning over the window -->
    <path d="M26 64 H88 V70 Q83 76 78 70 Q73 76 68 70 Q63 76 58 70 Q53 76 48 70 Q43 76 38 70 Q33 76 26 70 Z" fill="#4f8a5b"/>
    <!-- door -->
    <rect x="96" y="76" width="30" height="60" rx="2" fill="#c9a26b"/>
    <rect x="102" y="84" width="18" height="22" rx="2" fill="#e3eaf6"/>
    <circle cx="101" cy="114" r="2" fill="#2b2622" stroke="none"/>
    <!-- sign: crossed fork and knife -->
    <rect x="54" y="8" width="52" height="38" rx="8" fill="#d9534a"/>
    <g fill="none" stroke="#fff" stroke-width="3.5">
      <path d="M75 12 V19 Q75 23 80 23 Q85 23 85 19 V12 M80 12 V42" transform="rotate(-38 80 27)"/>
      <path d="M80 42 V12 Q87 18 87 28 H80" fill="#fff" transform="rotate(38 80 27)"/>
    </g>
  </g>
</svg>
