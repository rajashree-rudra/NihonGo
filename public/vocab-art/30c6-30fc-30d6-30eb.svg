    <rect x="40" y="88" width="8" height="40" rx="3" fill="#c9a26b"/>
    <rect x="112" y="88" width="8" height="40" rx="3" fill="#c9a26b"/>
    <rect x="40" y="88" width="8" height="40" rx="3" fill="#2b2622" opacity=".2" stroke="none"/>
    <rect x="112" y="88" width="8" height="40" rx="3" fill="#2b2622" opacity=".2" stroke="none"/>
    <!-- table top -->
    <path d="M34 76 H126 L140 88 H20 Z" fill="#c9a26b"/>
    <path d="M34 76 H126 L140 88 H20 Z" fill="#fff" opacity=".25" stroke="none"/>
