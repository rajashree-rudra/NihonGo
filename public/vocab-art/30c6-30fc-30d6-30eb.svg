<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="table">
  <!-- テーブル (table): a wooden table on four legs with a teapot and a cup of tea on it -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="84" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="138" rx="62" ry="6" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
