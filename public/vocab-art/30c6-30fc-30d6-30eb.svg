    <rect x="125" y="97" width="10" height="40" rx="3" fill="#c9a26b"/>
    <!-- teapot -->
    <path d="M47 64 Q38 60 34 50" fill="none" stroke="#2b2622" stroke-width="8"/>
    <path d="M47 64 Q38 60 34 50" fill="none" stroke="#3b5ba5" stroke-width="3.5"/>
    <path d="M79 58 Q90 58 88 68 Q86 76 76 76" fill="none" stroke="#2b2622" stroke-width="8"/>
    <path d="M79 58 Q90 58 88 68 Q86 76 76 76" fill="none" stroke="#3b5ba5" stroke-width="3.5"/>
    <path d="M44 82 Q40 66 50 56 Q62 50 74 56 Q84 66 80 82 Z" fill="#3b5ba5"/>
    <path d="M51 56 Q62 46 73 56 Z" fill="#3b5ba5"/>
    <circle cx="62" cy="48" r="3.5" fill="#f2c14e"/>
    <path d="M46 68 H78" fill="none" stroke="#fff" stroke-width="2.5" opacity=".8"/>
    <!-- cup and saucer with steam -->
    <path d="M112 71 Q120 71 119 76 Q118 80 111 79" fill="none"/>
    <path d="M96 68 H113 L111 80 Q104 83 98 80 Z" fill="#fff"/>
