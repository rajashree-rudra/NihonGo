  <circle cx="62" cy="88" r="52" fill="#fff" opacity=".55"/>
  <ellipse cx="56" cy="143" rx="38" ry="6" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- sound waves -->
    <path d="M92 38 Q100 50 92 62" fill="none" stroke-width="9"/>
    <path d="M92 38 Q100 50 92 62" fill="none" stroke="#d9534a" stroke-width="4"/>
    <path d="M106 28 Q120 50 106 72" fill="none" stroke-width="9"/>
    <path d="M106 28 Q120 50 106 72" fill="none" stroke="#d9534a" stroke-width="4"/>
    <path d="M121 18 Q140 50 121 82" fill="none" stroke-width="9"/>
    <path d="M121 18 Q140 50 121 82" fill="none" stroke="#d9534a" stroke-width="4"/>
    <g transform="translate(56 142)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-12" y="-40" width="9" height="37" rx="4" fill="#f6d3b3"/>
      <rect x="3" y="-40" width="9" height="37" rx="4" fill="#f6d3b3"/>
      <rect x="-27" y="-78" width="9" height="34" rx="4.5" fill="#d9534a"/>
      <circle cx="-22.5" cy="-42" r="5.5" fill="#f6d3b3"/>
      <path d="M-20 -104 Q-24 -82 -18 -72 H18 Q24 -82 20 -104 Z" fill="#2b2622"/>
      <!-- arm up, hand cupped beside the mouth -->
      <path d="M13 -74 L33 -72 L25 -90" fill="none" stroke-width="12"/>
      <path d="M13 -74 L33 -72 L25 -90" fill="none" stroke="#d9534a" stroke-width="7"/>
      <path d="M-15 -81 H15 L26 -36 H-26 Z" fill="#d9534a"/>
      <path d="M-24 -44 H24" fill="none" stroke="#fff" opacity=".8"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-19 -100 Q-21 -125 0 -125 Q21 -125 19 -100 Q15 -112 6 -113 Q0 -108 -6 -113 Q-15 -112 -19 -100 Z" fill="#2b2622"/>
      <circle cx="13" cy="-118" r="4" fill="#f2c14e"/>
      <path d="M-9 -103 Q-6 -106 -3 -103 M3 -103 Q6 -106 9 -103" fill="none"/>
      <circle cx="-11" cy="-96" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <!-- wide open mouth -->
      <path d="M-5 -96 Q0 -97 5 -96 Q5 -87 0 -87 Q-5 -87 -5 -96 Z" fill="#3d3a4a"/>
      <path d="M-3 -88.3 Q0 -91.5 3 -88.3 Q0 -87 -3 -88.3 Z" fill="#d9534a" stroke-width="1.5"/>
      <!-- cupped hand -->
      <circle cx="22" cy="-93" r="5.5" fill="#f6d3b3"/>
    </g>
  </g>
</svg>
