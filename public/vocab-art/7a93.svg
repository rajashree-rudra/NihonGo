  <circle cx="80" cy="80" r="56" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- frame and sky -->
    <rect x="32" y="26" width="96" height="98" rx="4" fill="#fff"/>
    <rect x="40" y="34" width="80" height="82" fill="#e3eaf6"/>
    <circle cx="101" cy="54" r="9" fill="#f2c14e"/>
    <path d="M50 92 Q50 84 58 84 Q60 76 69 78 Q76 76 78 84 Q85 84 85 92 Z" fill="#fff" stroke-width="2"/>
