<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="doctor">
  <!-- 医者 (doctor): white coat, stethoscope, clipboard, and a medical cross -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="84" r="52" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="141" rx="46" ry="6" fill="#c5e2cf"/>
  <!-- medical cross sign -->
  <g transform="translate(30 30)">
    <rect x="-13" y="-13" width="26" height="26" rx="7" fill="#fff" stroke="#2b2622" stroke-width="2.5"/>
    <path d="M-3 -8 H3 V-3 H8 V3 H3 V8 H-3 V3 H-8 V-3 H-3 Z" fill="#d9534a"/>
  </g>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" transform="translate(80 140)">
    <ellipse cx="-9" cy="-3" rx="8.5" ry="4.5" fill="#2b2622"/>
    <ellipse cx="9" cy="-3" rx="8.5" ry="4.5" fill="#2b2622"/>
    <rect x="-14" y="-36" width="10" height="33" rx="4" fill="#3d3a4a"/>
    <rect x="4" y="-36" width="10" height="33" rx="4" fill="#3d3a4a"/>
    <!-- sleeves -->
    <rect x="-31" y="-80" width="11" height="40" rx="5.5" fill="#fff"/>
    <circle cx="-25.5" cy="-38" r="5.5" fill="#f6d3b3"/>
    <rect x="20" y="-80" width="11" height="30" rx="5.5" fill="#fff" transform="rotate(-28 25 -80)"/>
    <!-- coat with a blue shirt and tie showing at the neck -->
    <path d="M-22 -30 V-72 Q-22 -83 -11 -83 H11 Q22 -83 22 -72 V-30 Z" fill="#fff"/>
    <path d="M-9 -83 L0 -64 L9 -83 Z" fill="#3b5ba5"/>
    <path d="M0 -79 L-2.5 -72 L0 -66 L2.5 -72 Z" fill="#d9534a" stroke-width="1.5"/>
    <path d="M-9 -83 L-3 -58 M9 -83 L3 -58" fill="none"/>
    <path d="M0 -60 V-31" fill="none" opacity=".4"/>
    <!-- pocket with a pen -->
    <rect x="7" y="-56" width="10" height="9" rx="2" fill="#fff"/>
    <path d="M12 -60 V-53" stroke="#3b5ba5" stroke-width="2.5"/>
    <!-- stethoscope -->
    <path d="M-10 -83 Q-17 -66 -9 -57 Q-4 -52 -4 -46" fill="none" stroke="#3d3a4a" stroke-width="2.5"/>
    <circle cx="-4" cy="-43" r="4" fill="#9aa3b0"/>
    <!-- clipboard in the raised hand -->
    <g transform="translate(36 -96) rotate(10)">
      <rect x="-11" y="-14" width="22" height="28" rx="3" fill="#c9a26b"/>
      <rect x="-8" y="-9" width="16" height="20" rx="1.5" fill="#fff" stroke-width="1.8"/>
      <path d="M-5 -4 H5 M-5 1 H5 M-5 6 H2" stroke-width="1.6" opacity=".6"/>
      <rect x="-4" y="-17" width="8" height="5" rx="1.5" fill="#9aa3b0" stroke-width="1.8"/>
    </g>
    <circle cx="33" cy="-86" r="5.5" fill="#f6d3b3"/>
    <!-- head -->
    <rect x="-5" y="-91" width="10" height="9" fill="#f6d3b3" stroke="none"/>
    <circle cx="0" cy="-104" r="18" fill="#f6d3b3"/>
    <path d="M-18 -105 Q-19 -126 0 -126 Q20 -126 18 -104 Q16 -114 6 -115 Q-6 -116 -12 -110 Q-15 -108 -18 -105 Z" fill="#5a4636"/>
    <circle cx="-6" cy="-103" r="2.2" fill="#2b2622" stroke="none"/>
    <circle cx="6" cy="-103" r="2.2" fill="#2b2622" stroke="none"/>
    <circle cx="-10" cy="-97" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
    <circle cx="10" cy="-97" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
    <path d="M-6 -95 Q0 -89 6 -95" fill="none"/>
  </g>
</svg>
