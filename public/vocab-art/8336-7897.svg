<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="rice bowl; tea bowl">
  <!-- 茶碗 (rice bowl): a blue bowl heaped with white rice, chopsticks in front -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="80" cy="80" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="128" rx="40" ry="5" fill="#ecdcb6"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- rice heaped above the rim -->
    <path d="M38 82 Q38 48 80 44 Q122 48 122 82 Z" fill="#fff"/>
    <g fill="#efe6dc" stroke-width="1.6">
      <ellipse cx="66" cy="58" rx="3.5" ry="2" transform="rotate(-20 66 58)"/>
      <ellipse cx="88" cy="55" rx="3.5" ry="2" transform="rotate(15 88 55)"/>
      <ellipse cx="56" cy="72" rx="3.5" ry="2" transform="rotate(25 56 72)"/>
      <ellipse cx="78" cy="68" rx="3.5" ry="2" transform="rotate(-10 78 68)"/>
      <ellipse cx="102" cy="70" rx="3.5" ry="2" transform="rotate(30 102 70)"/>
    </g>
    <!-- bowl -->
    <rect x="64" y="114" width="32" height="10" rx="3" fill="#3b5ba5"/>
    <path d="M30 80 H130 Q128 112 98 118 H62 Q32 112 30 80 Z" fill="#3b5ba5"/>
    <path d="M42 96 Q48 90 54 96 Q60 102 66 96 Q72 90 78 96 Q84 102 90 96 Q96 90 102 96 Q108 102 114 96 Q117 93 119 95" fill="none" stroke="#fff" stroke-width="2.5"/>
    <!-- chopsticks lying in front -->
    <path d="M30 138 L130 132" stroke="#2b2622" stroke-width="8"/>
    <path d="M30 138 L130 132" stroke="#d9534a" stroke-width="3.5"/>
    <path d="M34 145 L132 140" stroke="#2b2622" stroke-width="8"/>
    <path d="M34 145 L132 140" stroke="#d9534a" stroke-width="3.5"/>
  </g>
</svg>
