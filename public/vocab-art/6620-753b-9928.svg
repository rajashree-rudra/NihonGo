<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="movie theater">
  <!-- 映画館 (movie theater): a big screen between red curtains, rows of red seats and people watching -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- screen with a picture on it -->
    <rect x="30" y="26" width="100" height="58" rx="3" fill="#fff"/>
    <path d="M34 80 L60 54 L75 68 L94 50 L126 80 Z" fill="#4f8a5b"/>
    <circle cx="110" cy="42" r="7" fill="#f2c14e"/>
    <!-- curtains -->
    <path d="M16 22 H34 Q29 56 36 92 Q26 96 16 100 Z" fill="#d9534a"/>
    <path d="M144 22 H126 Q131 56 124 92 Q134 96 144 100 Z" fill="#d9534a"/>
    <rect x="14" y="14" width="132" height="12" rx="5" fill="#d9534a"/>
    <!-- back row: people watching -->
    <circle cx="44" cy="100" r="8.5" fill="#5a4636"/>
    <circle cx="116" cy="100" r="8.5" fill="#2b2622"/>
    <rect x="30" y="104" width="28" height="16" rx="6" fill="#d9534a"/>
    <rect x="66" y="104" width="28" height="16" rx="6" fill="#d9534a"/>
    <rect x="102" y="104" width="28" height="16" rx="6" fill="#d9534a"/>
    <!-- front row -->
    <circle cx="80" cy="120" r="11" fill="#2b2622"/>
    <rect x="22" y="124" width="34" height="22" rx="8" fill="#d9534a"/>
    <rect x="63" y="124" width="34" height="22" rx="8" fill="#d9534a"/>
    <rect x="104" y="124" width="34" height="22" rx="8" fill="#d9534a"/>
  </g>
</svg>
