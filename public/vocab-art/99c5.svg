<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="train station">
  <!-- 駅 (station): a train stopped at a platform under a roof, with a station clock hanging down -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="86" r="54" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- roof posts -->
    <rect x="28" y="40" width="7" height="86" fill="#9aa3b0"/>
    <rect x="125" y="40" width="7" height="86" fill="#9aa3b0"/>
    <!-- train -->
    <path d="M14 76 Q14 70 20 70 H124 Q144 70 146 92 V116 H14 Z" fill="#fff"/>
    <path d="M14 100 H146 V108 H14 Z" fill="#3b5ba5"/>
    <g fill="#e3eaf6">
      <rect x="22" y="78" width="18" height="14" rx="2"/>
      <rect x="66" y="78" width="18" height="14" rx="2"/>
      <rect x="90" y="78" width="18" height="14" rx="2"/>
      <path d="M118 78 H128 Q138 80 140 92 H118 Z"/>
    </g>
    <rect x="46" y="76" width="14" height="40" rx="1.5" fill="#d8d3ca"/>
    <path d="M53 76 V116" fill="none"/>
    <!-- station roof -->
    <path d="M12 30 H148 L142 44 H18 Z" fill="#d9534a"/>
    <!-- clock -->
    <path d="M80 44 V50" fill="none"/>
    <circle cx="80" cy="59" r="9" fill="#fff"/>
    <path d="M80 54 V59 L84 61" fill="none" stroke-width="2"/>
    <!-- platform with a yellow safety line -->
    <rect x="10" y="114" width="140" height="22" rx="4" fill="#d8d3ca"/>
    <path d="M12 120 H148" fill="none" stroke="#f2c14e" stroke-width="4"/>
  </g>
</svg>
