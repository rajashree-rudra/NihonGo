<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="glass, cup (for drinking)">
  <!-- コップ (glass): a clear drinking glass with water in it -->
  <rect width="160" height="160" rx="28" fill="#e3eaf6"/>
  <circle cx="80" cy="88" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="138" rx="40" ry="6" fill="#c7d3ea"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- glass body -->
    <path d="M50 34 H110 L102 128 Q101 136 93 136 H67 Q59 136 58 128 Z" fill="#fff" fill-opacity=".75"/>
    <!-- water -->
    <path d="M52.4 62 H107.6 L102 128 Q101 136 93 136 H67 Q59 136 58 128 Z" fill="#3b5ba5" fill-opacity=".35" stroke="none"/>
    <ellipse cx="80" cy="62" rx="27.6" ry="5" fill="#3b5ba5" fill-opacity=".45" stroke-width="2"/>
    <!-- thick glass bottom -->
    <path d="M59 124 Q80 128 101 124" fill="none" stroke-width="2"/>
    <!-- shine -->
    <path d="M60 46 L65 116" fill="none" stroke="#fff" stroke-width="5"/>
    <path d="M70 44 L71 56" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- rim -->
    <ellipse cx="80" cy="34" rx="30" ry="6" fill="#fff" fill-opacity=".6"/>
    <!-- outline on top -->
    <path d="M50 34 L58 128 Q59 136 67 136 H93 Q101 136 102 128 L110 34" fill="none"/>
  </g>
</svg>
