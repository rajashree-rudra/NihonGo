<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="friend">
  <!-- 友達 (friend): two smiling friends giving each other a high five -->
  <rect width="160" height="160" rx="28" fill="#f8edd6"/>
  <circle cx="80" cy="86" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="141" rx="62" ry="6" fill="#ecdcb6"/>
