    <!-- high-five burst -->
    <path d="M80 12 V6 M69 16 L65 11 M91 16 L95 11" fill="none" stroke="#d9534a" stroke-width="3"/>
    <!-- friend 1 -->
    <g transform="translate(48 140)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-13" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="3" y="-40" width="10" height="37" rx="4" fill="#3d3a4a"/>
      <rect x="-28" y="-78" width="10" height="36" rx="5" fill="#4f8a5b"/>
      <circle cx="-23" cy="-40" r="5.5" fill="#f6d3b3"/>
      <path d="M-20 -38 V-70 Q-20 -81 -9 -81 H9 Q20 -81 20 -70 V-38 Z" fill="#4f8a5b"/>
      <path d="M-6 -81 Q0 -75 6 -81" fill="none"/>
      <path d="M16 -76 L29 -108" stroke-width="12"/>
      <path d="M16 -76 L29 -108" stroke="#4f8a5b" stroke-width="7"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-18 -103 Q-19 -124 0 -124 Q20 -124 18 -102 Q16 -112 6 -113 Q-6 -114 -12 -108 Q-15 -106 -18 -103 Z" fill="#5a4636"/>
      <circle cx="-4" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="8" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-8" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="12" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-4 -93 Q2 -85 8 -93 Z" fill="#fff"/>
    </g>
    <!-- friend 2 -->
    <g transform="translate(112 140)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-12" y="-38" width="9" height="35" rx="4" fill="#f6d3b3"/>
      <rect x="3" y="-38" width="9" height="35" rx="4" fill="#f6d3b3"/>
      <path d="M-17 -52 H17 L22 -32 H-22 Z" fill="#3b5ba5"/>
      <rect x="18" y="-78" width="9" height="36" rx="4.5" fill="#f2c14e"/>
      <circle cx="22.5" cy="-40" r="5.5" fill="#f6d3b3"/>
