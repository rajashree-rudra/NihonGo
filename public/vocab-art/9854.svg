<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="face">
  <!-- 顔 (face): a big smiling face framed by four red corner marks, like a camera finding a face -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="80" r="58" fill="#fff" opacity=".55"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- neck and shoulders -->
    <rect x="71" y="100" width="18" height="26" fill="#f6d3b3"/>
    <path d="M30 162 Q30 132 56 126 Q68 123 80 123 Q92 123 104 126 Q130 132 130 162 Z" fill="#f2c14e"/>
    <path d="M70 124 L80 134 L90 124" fill="none" stroke="#fff"/>
    <!-- face (the same person, close up) -->
    <g transform="translate(80 76) scale(2.1)" stroke-width="1.2">
      <circle cx="-18" cy="2" r="4.5" fill="#f6d3b3"/>
      <circle cx="18" cy="2" r="4.5" fill="#f6d3b3"/>
      <circle r="18" fill="#f6d3b3"/>
      <path d="M-19 1 Q-21 -23 0 -23 Q21 -23 19 1 Q15 -10 6 -11 Q0 -6 -6 -11 Q-15 -10 -19 1 Z" fill="#5a4636"/>
      <circle cx="-6" cy="2" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="2" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10.5" cy="8" r="2.6" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10.5" cy="8" r="2.6" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-1.2 7 Q0 8.1 1.2 7" fill="none"/>
      <path d="M-5 10.5 Q0 16 5 10.5 Z" fill="#d9534a"/>
    </g>
    <!-- corner marks framing the face -->
    <g fill="none" stroke-width="9">
      <path d="M36 50 V36 H50 M110 36 H124 V50 M124 102 V116 H110 M50 116 H36 V102"/>
    </g>
    <g fill="none" stroke="#d9534a" stroke-width="4.5">
      <path d="M36 50 V36 H50 M110 36 H124 V50 M124 102 V116 H110 M50 116 H36 V102"/>
    </g>
  </g>
</svg>
