<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="tape (sticky tape; cassette tape)">
  <!-- テープ (tape): a roll of sticky tape with a strip pulled out, the end cut in a zigzag -->
  <rect width="160" height="160" rx="28" fill="#fbe6e1"/>
  <circle cx="74" cy="80" r="54" fill="#fff" opacity=".55"/>
  <ellipse cx="86" cy="128" rx="56" ry="5" fill="#f1cfc7"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- pulled-out strip -->
    <path d="M66 112 H130 L126 116.5 L130 121 L126 125.5 L130 125.5 H66 Z" fill="#f2c14e"/>
    <path d="M78 116 H120" fill="none" stroke="#fff" stroke-width="2.5" opacity=".8"/>
    <!-- roll -->
    <circle cx="66" cy="76" r="40" fill="#f2c14e"/>
    <circle cx="66" cy="76" r="23" fill="#c9a26b"/>
    <circle cx="66" cy="76" r="17" fill="#fbe6e1"/>
    <path d="M40 60 Q46 46 60 41" fill="none" stroke="#fff" stroke-width="4"/>
  </g>
</svg>
