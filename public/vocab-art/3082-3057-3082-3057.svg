<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="hello (on the phone)">
  <!-- もしもし (hello on the phone): a smiling person holding a phone to the ear, with sound waves and a speech bubble -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="66" cy="88" r="52" fill="#fff" opacity=".55"/>
  <ellipse cx="62" cy="143" rx="38" ry="6" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- speech bubble with dots -->
    <path d="M114 18 H140 Q150 18 150 28 V42 Q150 52 140 52 H126 L112 60 L116 52 H114 Q104 52 104 42 V28 Q104 18 114 18 Z" fill="#fff"/>
    <circle cx="117" cy="35" r="3" fill="#4f8a5b" stroke="none"/>
    <circle cx="127" cy="35" r="3" fill="#4f8a5b" stroke="none"/>
    <circle cx="137" cy="35" r="3" fill="#4f8a5b" stroke="none"/>
    <g transform="translate(62 142)">
      <ellipse cx="-8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <ellipse cx="8" cy="-3" rx="8" ry="4.5" fill="#2b2622"/>
      <rect x="-12" y="-40" width="9" height="37" rx="4" fill="#f6d3b3"/>
      <rect x="3" y="-40" width="9" height="37" rx="4" fill="#f6d3b3"/>
      <rect x="-27" y="-78" width="9" height="34" rx="4.5" fill="#3b5ba5"/>
      <circle cx="-22.5" cy="-42" r="5.5" fill="#f6d3b3"/>
      <path d="M-20 -104 Q-24 -82 -18 -72 H18 Q24 -82 20 -104 Z" fill="#5a4636"/>
      <!-- arm bent up to the ear -->
      <path d="M13 -74 L34 -68 L28 -92" fill="none" stroke-width="12"/>
      <path d="M13 -74 L34 -68 L28 -92" fill="none" stroke="#3b5ba5" stroke-width="7"/>
      <path d="M-15 -81 H15 L26 -36 H-26 Z" fill="#3b5ba5"/>
      <path d="M-24 -44 H24" fill="none" stroke="#fff" opacity=".8"/>
      <rect x="-5" y="-89" width="10" height="9" fill="#f6d3b3" stroke="none"/>
      <circle cx="0" cy="-102" r="18" fill="#f6d3b3"/>
      <path d="M-19 -100 Q-21 -125 0 -125 Q21 -125 19 -100 Q15 -112 6 -113 Q0 -108 -6 -113 Q-15 -112 -19 -100 Z" fill="#5a4636"/>
      <!-- phone at the ear -->
      <rect x="15" y="-118" width="10" height="22" rx="3" fill="#3d3a4a" transform="rotate(12 20 -107)"/>
      <circle cx="26" cy="-95" r="5.5" fill="#f6d3b3"/>
      <!-- sound waves -->
      <path d="M33 -120 Q39 -113 34 -105 M39 -126 Q48 -113 40 -100" fill="none"/>
      <circle cx="-6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="6" cy="-101" r="2.2" fill="#2b2622" stroke="none"/>
      <circle cx="-10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <circle cx="10" cy="-95" r="3" fill="#f4a3a0" stroke="none" opacity=".7"/>
      <path d="M-6 -94 Q0 -86 6 -94 Z" fill="#d9534a"/>
    </g>
