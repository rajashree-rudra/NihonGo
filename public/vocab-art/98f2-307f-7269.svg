<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="drink, beverage">
  <!-- 飲み物 (drink): a bottle of water, a glass of orange juice with a straw, and a hot mug, side by side -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="80" cy="84" r="56" fill="#fff" opacity=".55"/>
  <ellipse cx="80" cy="134" rx="64" ry="6" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- bottle -->
    <rect x="30" y="34" width="12" height="9" rx="2" fill="#3b5ba5"/>
    <path d="M31 43 H41 Q42 50 48 55 Q50 57 50 62 V124 Q50 130 44 130 H28 Q22 130 22 124 V62 Q22 57 24 55 Q30 50 31 43 Z" fill="#c3dcf5"/>
    <rect x="22" y="78" width="28" height="22" fill="#4f8a5b"/>
    <path d="M28 106 V122" fill="none" stroke="#fff" stroke-width="3.5" opacity=".8"/>
    <!-- straw -->
    <path d="M84 96 L92 32 L100 26" fill="none" stroke-width="8"/>
    <path d="M84 96 L92 32 L100 26" fill="none" stroke="#d9534a" stroke-width="3.5"/>
    <!-- juice glass -->
    <path d="M56 58 H104 L98 126 Q97 132 91 132 H69 Q63 132 62 126 Z" fill="#fff" fill-opacity=".7"/>
    <path d="M57.4 72 H102.6 L98 126 Q97 132 91 132 H69 Q63 132 62 126 Z" fill="#f2a93b"/>
    <ellipse cx="80" cy="72" rx="22.6" ry="4.5" fill="#f8c66a" stroke-width="2"/>
    <ellipse cx="80" cy="58" rx="24" ry="4.5" fill="none"/>
    <path d="M66 82 L70 120" fill="none" stroke="#fff" stroke-width="3.5" opacity=".7"/>
    <!-- orange slice on the rim -->
    <path d="M92 58 A12 12 0 0 1 116 58 Z" fill="#f2a93b"/>
    <path d="M96 58 A8 8 0 0 1 112 58 M104 58 V50 M104 58 L98.5 52.5 M104 58 L109.5 52.5" fill="none" stroke-width="1.6"/>
    <!-- hot mug -->
    <g fill="none" stroke="#9a958b" stroke-width="2.8">
      <path d="M116 82 Q112 76 116 70 Q120 64 116 58"/>
      <path d="M128 82 Q124 76 128 70 Q132 64 128 58"/>
    </g>
    <path d="M136 100 Q146 100 146 109 Q146 118 136 118" fill="none" stroke-width="10"/>
    <path d="M136 100 Q146 100 146 109 Q146 118 136 118" fill="none" stroke="#d9534a" stroke-width="5"/>
    <path d="M108 92 H138 V124 Q138 130 132 130 H114 Q108 130 108 124 Z" fill="#d9534a"/>
    <ellipse cx="123" cy="92" rx="15" ry="4" fill="#d9534a"/>
    <ellipse cx="123" cy="92.5" rx="11.5" ry="2.6" fill="#5a3a26" stroke-width="1.8"/>
  </g>
</svg>
