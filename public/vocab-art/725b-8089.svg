<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="beef">
  <!-- 牛肉 (beef): a red marbled steak on a plate, with a cow-face badge showing which animal -->
  <rect width="160" height="160" rx="28" fill="#e1f1e6"/>
  <circle cx="86" cy="92" r="50" fill="#fff" opacity=".55"/>
  <ellipse cx="88" cy="138" rx="56" ry="6" fill="#c5e2cf"/>
  <g stroke="#2b2622" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- plate -->
    <ellipse cx="90" cy="114" rx="60" ry="22" fill="#fff"/>
    <ellipse cx="90" cy="114" rx="46" ry="15" fill="none" opacity=".25"/>
    <!-- marbled steak -->
    <path d="M44 106 Q40 86 62 82 Q80 78 92 86 Q112 78 130 90 Q142 104 126 116 Q102 128 72 124 Q46 120 44 106 Z" fill="#d9534a"/>
    <g fill="none" stroke="#fff" stroke-width="2.6">
      <path d="M58 98 Q68 92 78 98 Q88 104 98 98"/>
      <path d="M68 112 Q80 106 92 112"/>
      <path d="M106 92 Q114 96 120 106"/>
      <path d="M100 112 Q110 114 118 110"/>
    </g>
    <!-- badge: cow face -->
    <g transform="translate(38 40)">
      <circle r="25" fill="#9cc27a"/>
      <ellipse cx="-14" cy="-6" rx="7" ry="4" fill="#fff" transform="rotate(-20 -14 -6)"/>
      <ellipse cx="14" cy="-6" rx="7" ry="4" fill="#fff" transform="rotate(20 14 -6)"/>
      <path d="M-8 -13 Q-14 -18 -10 -23 Q-6 -19 -3 -15 Z" fill="#efe6dc" stroke-width="2"/>
      <path d="M8 -13 Q14 -18 10 -23 Q6 -19 3 -15 Z" fill="#efe6dc" stroke-width="2"/>
      <ellipse cx="0" cy="-2" rx="11" ry="13" fill="#fff"/>
      <path d="M2 -14 Q9 -14 10.5 -7 Q6 -5 3 -9 Z" fill="#2b2622" stroke="none"/>
      <circle cx="-4.5" cy="-4" r="1.8" fill="#2b2622" stroke="none"/>
      <circle cx="4.5" cy="-4" r="1.8" fill="#2b2622" stroke="none"/>
      <ellipse cx="0" cy="9" rx="10" ry="6.5" fill="#f4a3a0"/>
      <circle cx="-3.5" cy="9" r="1.4" fill="#2b2622" stroke="none"/>
      <circle cx="3.5" cy="9" r="1.4" fill="#2b2622" stroke="none"/>
    </g>
  </g>
</svg>
